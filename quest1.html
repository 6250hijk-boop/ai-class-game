<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>퀘스트1 - 인공지능 세계의 법률</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── 게임 화면 ── */
    body { margin:0; overflow:hidden; }

    .game-screen {
      position:fixed; inset:0;
      background:#000;
    }

    /* 배경 */
    .game-bg {
      position:absolute; inset:0;
      background: url('images/bgq1-1.png') center/cover no-repeat;
      transition: background-image 0.5s ease;
    }
    .game-bg::after {
      content:'';
      position:absolute; inset:0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.7) 100%);
    }

    /* 캐릭터 */
    .game-character {
      position:absolute;
      bottom:200px; right:8%;
      height:55vh; max-height:420px;
      object-fit:contain;
      filter:drop-shadow(4px 4px 12px rgba(0,0,0,0.8));
      animation:charFloat 3s ease-in-out infinite;
      z-index:10;
      transition: src 0.3s ease;
    }
    @keyframes charFloat {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(-10px); }
    }

    /* 상단 HUD */
    .game-hud {
      position:absolute; top:0; left:0; right:0;
      padding:16px 20px;
      display:flex; align-items:center; gap:12px;
      background:linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index:20;
    }
    .hud-back {
      background:rgba(255,255,255,0.15);
      border:1px solid rgba(255,255,255,0.2);
      border-radius:8px; padding:6px 12px;
      color:white; font-size:13px; cursor:pointer;
      text-decoration:none; transition:all .2s;
    }
    .hud-back:hover { background:rgba(255,255,255,0.25); }
    .hud-title {
      font-family:'Jua',sans-serif;
      font-size:15px; color:white;
      text-shadow:0 2px 4px rgba(0,0,0,0.8);
    }
    .hud-score {
      margin-left:auto;
      background:rgba(99,179,237,0.25);
      border:1px solid rgba(99,179,237,0.4);
      border-radius:20px; padding:5px 14px;
      font-size:13px; color:#63b3ed; font-weight:700;
    }
    .hud-progress {
      background:rgba(255,255,255,0.15);
      border-radius:20px; padding:5px 12px;
      font-size:12px; color:rgba(255,255,255,0.7);
    }

    /* 하단 대화창 */
    .dialog-box {
      position:absolute; bottom:0; left:0; right:0;
      z-index:20;
      padding:0 20px 20px;
    }

    /* 이름 태그 */
    .char-name-tag {
      display:inline-block;
      background:linear-gradient(135deg, #63b3ed, #4299e1);
      color:#0a0e1a; font-weight:700;
      font-family:'Jua',sans-serif;
      padding:6px 20px; border-radius:10px 10px 0 0;
      font-size:15px; margin-bottom:0;
      box-shadow:0 -2px 10px rgba(99,179,237,0.3);
    }

    /* 대화 텍스트 박스 */
    .dialog-text-box {
      background:rgba(10,14,26,0.92);
      border:2px solid rgba(99,179,237,0.4);
      border-radius:0 12px 12px 12px;
      padding:22px 60px 22px 24px;
      position:relative;
      min-height:120px;
      backdrop-filter:blur(10px);
      box-shadow:0 -4px 30px rgba(0,0,0,0.5);
    }
    .dialog-text {
      font-size:17px; line-height:1.9;
      color:#e2e8f0;
      text-shadow:0 1px 3px rgba(0,0,0,0.5);
      white-space:pre-line;
    }

    /* 다음 화살표 */
    .dialog-next {
      position:absolute; bottom:14px; right:16px;
      width:28px; height:28px;
      background:rgba(99,179,237,0.2);
      border:2px solid rgba(99,179,237,0.5);
      border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all .2s;
      animation:arrowBounce 1s ease-in-out infinite;
    }
    .dialog-next:hover { background:rgba(99,179,237,0.4); }
    @keyframes arrowBounce {
      0%,100% { transform:translateY(0); }
      50%      { transform:translateY(3px); }
    }
    .dialog-next::after {
      content:'▼'; font-size:11px; color:#63b3ed;
    }

    /* 선택지 버튼들 */
    .dialog-choices {
      display:flex; flex-direction:column; gap:8px;
      margin-top:10px;
    }
    .choice-btn {
      background:rgba(99,179,237,0.1);
      border:1px solid rgba(99,179,237,0.3);
      border-radius:10px; padding:12px 16px;
      color:#e2e8f0; font-size:14px;
      cursor:pointer; text-align:left;
      transition:all .2s; font-family:inherit;
      backdrop-filter:blur(5px);
    }
    .choice-btn:hover {
      background:rgba(99,179,237,0.25);
      border-color:rgba(99,179,237,0.6);
      transform:translateX(4px);
    }

    /* 퀴즈 팝업 */
    .quiz-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.85);
      backdrop-filter:blur(6px);
      z-index:200;
      display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .quiz-box {
      background:var(--card);
      border:1px solid var(--border);
      border-radius:24px;
      width:100%; max-width:500px;
      padding:32px;
      animation:slideUp .4s ease;
      box-shadow:0 0 80px rgba(99,179,237,0.2);
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(40px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .quiz-box h2 { font-family:'Jua',sans-serif; font-size:20px; color:var(--primary); margin-bottom:6px; }
    .quiz-question { font-size:16px; font-weight:600; margin:16px 0; line-height:1.5; }
    .quiz-opt {
      width:100%; padding:13px 16px;
      background:rgba(255,255,255,0.06);
      border:2px solid var(--border);
      border-radius:12px; color:var(--text);
      font-size:14px; cursor:pointer;
      margin-bottom:10px; text-align:left;
      font-family:inherit; transition:all .2s;
    }
    .quiz-opt:hover { border-color:var(--primary); background:rgba(99,179,237,0.1); }
    .quiz-opt.correct { border-color:var(--green); background:rgba(104,211,145,0.15); }
    .quiz-opt.wrong   { border-color:var(--red);   background:rgba(252,129,129,0.15); }
    .quiz-progress { display:flex; gap:6px; margin-bottom:20px; }
    .quiz-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.15); transition:background .3s; }
    .quiz-dot.done { background:var(--green); }
    .quiz-dot.cur  { background:var(--primary); }

    /* 타이핑 효과 커서 */
    .typing-cursor {
      display:inline-block; width:2px; height:1em;
      background:#63b3ed; margin-left:2px;
      animation:blink .7s infinite;
      vertical-align:text-bottom;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* 레벨업 */
    .levelup-screen {
      position:fixed; inset:0; z-index:400;
      background:rgba(0,0,0,0.9);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:16px;
    }
    .levelup-screen h1 { font-family:'Jua',sans-serif; font-size:48px; color:#f6ad55; }
    .levelup-screen p  { font-size:20px; color:#63b3ed; }

    /* XP 팝업 */
    .xp-popup {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      background:linear-gradient(135deg,#63b3ed,#f6ad55);
      color:#0a0e1a; font-weight:700;
      font-size:24px; padding:16px 40px;
      border-radius:20px; z-index:500;
      animation:popIn .4s ease, fadeOutUp .5s ease 1.5s forwards;
      pointer-events:none;
    }
    @keyframes popIn { from{transform:translate(-50%,-50%) scale(.5);opacity:0} to{transform:translate(-50%,-50%) scale(1);opacity:1} }
    @keyframes fadeOutUp { to{opacity:0;transform:translate(-50%,-70%)} }
  </style>
</head>
<body>

<!-- 퀴즈 팝업 -->
<div id="quiz-overlay" class="quiz-overlay" style="display:none;">
  <div class="quiz-box">
    <h2>⚖️ 법률 퀴즈 타임!</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">배운 내용을 확인해봐요!</p>
    <div class="quiz-progress" id="quiz-dots"></div>
    <div id="quiz-content"></div>
    <div id="quiz-result" style="display:none;"></div>
  </div>
</div>

<!-- 게임 화면 -->
<div class="game-screen">
  <!-- 배경 -->
  <div class="game-bg" id="game-bg"></div>

  <!-- 캐릭터 -->
  <img class="game-character" id="game-char" src="images/robot_1.png" alt="캐릭터">

  <!-- 상단 HUD -->
  <div class="game-hud">
    <a href="main.html" class="hud-back">← 메인</a>
    <div class="hud-title">⚖️ 퀘스트 1: 인공지능 세계의 법률</div>
    <div class="hud-progress" id="hud-progress">0 / 12</div>
    <div class="hud-score" id="hud-score">0 점</div>
  </div>

  <!-- 하단 대화창 -->
  <div class="dialog-box">
    <div class="char-name-tag" id="dialog-name">AI 가디언</div>
    <div class="dialog-text-box">
      <div class="dialog-text" id="dialog-text">
        <span class="typing-cursor"></span>
      </div>
      <div class="dialog-next" id="dialog-next" onclick="nextMessage()"></div>
    </div>
    <div class="dialog-choices" id="dialog-choices"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const MESSAGES = [
  { text:"여기는 대한민국 인공지능 세계야 🌏\n여기에서 살아가려면 법을 알고 있어야겠지? ⚖️\n여기 세계의 법을 알려줄게!" },
  { text:"나는 AI로 만들어진 캐릭터야 🤖\n나는 AI로 만들어진 이미지이기 때문에\nAI로 생성된 사실을 알려줘야 해." },
  { text:"대한민국에서 2026년 1월 22일부터 시행되었지! 📅\n그래서 AI로 만들어진 광고를 보면 아래에\n\"본 광고는 AI로 만들어졌습니다.\"라고 표기되어 있지." },
  { text:"이미지, 동영상, 오디오 콘텐츠 모두 포함이야! 🎬🎵🖼️\n특히 실제와 구분이 어렵다면\n잘 보이도록 표시해야 하지." },
  { text:"개인정보 보호법에 대해서도 알아볼까? 🔒\nAI가 더 똑똑한 AI로 성장하기 위해서는\n많은 정보를 학습해야 해." },
  { text:"하지만 개인정보는 허락 없이 사용할 수 없어! ⚠️\n이것은 아주 중요한 법이야.\n꼭 기억해둬!" },
  { type:"quiz_trigger", text:"✨ 배운 내용을 퀴즈로 확인해볼까?\n준비됐으면 아래 버튼을 눌러봐!" },
];

const QUIZZES = [
  {
    q:"AI로 만들어진 광고에는 무엇을 표기해야 하나요?",
    opts:["본 광고는 AI로 만들어졌습니다.","이 광고는 가짜입니다.","표기하지 않아도 됩니다.","AI 광고 금지"],
    ans:0,
    exp:"2026년 1월 22일부터 AI 생성 광고에는 '본 광고는 AI로 만들어졌습니다.'를 표기해야 합니다."
  },
  {
    q:"AI 콘텐츠 표시 의무가 적용되는 것은?",
    opts:["이미지만","동영상만","이미지, 동영상, 오디오 모두","텍스트만"],
    ans:2,
    exp:"이미지, 동영상, 오디오 콘텐츠 모두 AI 생성 표시 의무가 적용됩니다."
  },
  {
    q:"AI가 더 똑똑해지기 위해 무엇이 필요한가요?",
    opts:["전기","많은 학습 데이터","물","더 큰 컴퓨터"],
    ans:1,
    exp:"AI는 많은 데이터를 학습해야 더 발전할 수 있습니다."
  },
];

let currentUser = null;
let userData = null;
let msgIdx = 0;
let isTyping = false;
let typingTimer = null;
let quizIdx = 0;
let quizScore = 0;

requireAuth(async (user) => {
  currentUser = user;
  if (user.uid === 'student') {
    userData = { charName:'AI', score:0, quests:{} };
  } else {
    const snap = await db.collection('users').where('id','==',user.id).get();
    if (!snap.empty) {
      userData = snap.docs[0].data();
      currentUser.uid = snap.docs[0].id;
    }
  }
  updateHUD();
  const savedIdx = (userData.quests||{}).q1_msgIdx || 0;
  msgIdx = Math.min(savedIdx, MESSAGES.length - 1);
  document.getElementById('dialog-name').textContent = userData.charName || 'AI 가디언';
  updateCharImage();
  setTimeout(() => showMessage(msgIdx), 500);
});

function updateCharImage() {
  const score = userData.score || 0;
  const lv = getLevelByScore(score);
  document.getElementById('game-char').src = lv.img;
}

function updateHUD() {
  const score = userData.score || 0;
  document.getElementById('hud-score').textContent = score + ' 점';
  document.getElementById('hud-progress').textContent = `${msgIdx+1} / ${MESSAGES.length}`;
}

function typeText(el, text, cb) {
  el.innerHTML = '';
  isTyping = true;
  document.getElementById('dialog-next').style.opacity = '0.3';
  // \n을 그대로 유지하며 타이핑
  let i = 0;
  typingTimer = setInterval(() => {
    if (i < text.length) {
      el.textContent = text.slice(0, i+1);
      i++;
    } else {
      clearInterval(typingTimer);
      el.textContent = text;
      isTyping = false;
      document.getElementById('dialog-next').style.opacity = '1';
      if (cb) cb();
    }
  }, 25);
}

function showMessage(idx) {
  if (idx >= MESSAGES.length) { showComplete(); return; }
  const msg = MESSAGES[idx];
  document.getElementById('hud-progress').textContent = `${idx+1} / ${MESSAGES.length}`;
  document.getElementById('dialog-choices').innerHTML = '';

  const textEl = document.getElementById('dialog-text');

  if (msg.type === 'quiz_trigger') {
    typeText(textEl, msg.text, () => {
      document.getElementById('dialog-next').style.display = 'none';
      document.getElementById('dialog-choices').innerHTML = `
        <button class="choice-btn" onclick="startQuiz()">🎮 퀴즈 시작하기!</button>
        <button class="choice-btn" onclick="saveAndExit()">💾 저장하고 나가기</button>
      `;
    });
  } else {
    typeText(textEl, msg.text);
    document.getElementById('dialog-next').style.display = 'flex';
  }
}

function nextMessage() {
  if (isTyping) {
    // 타이핑 중이면 즉시 완성
    clearInterval(typingTimer);
    const msg = MESSAGES[msgIdx];
    document.getElementById('dialog-text').textContent = msg.text;
    isTyping = false;
    document.getElementById('dialog-next').style.opacity = '1';
    return;
  }
  msgIdx++;
  autoSave();
  showMessage(msgIdx);
}

async function autoSave() {
  if (currentUser.uid === 'student') return;
  await db.collection('users').doc(currentUser.uid).update({
    'quests.q1_msgIdx': msgIdx
  });
}

async function saveAndExit() {
  await autoSave();
  window.location.href = 'main.html';
}

// 화면 클릭, 키보드로 다음 대화
document.addEventListener('click', (e) => {
  // 버튼, 퀴즈 팝업 클릭은 제외
  if (e.target.closest('.dialog-choices') ||
      e.target.closest('.quiz-overlay') ||
      e.target.closest('.dialog-next') ||
      e.target.closest('.hud-back')) return;
  nextMessage();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') nextMessage();
});

// ── 퀴즈 ──
function startQuiz() {
  quizIdx = 0; quizScore = 0;
  document.getElementById('quiz-overlay').style.display = 'flex';
  showQuiz();
}

function showQuiz() {
  const q = QUIZZES[quizIdx];
  document.getElementById('quiz-dots').innerHTML = QUIZZES.map((_,i) =>
    `<div class="quiz-dot ${i<quizIdx?'done':i===quizIdx?'cur':''}"></div>`
  ).join('');
  document.getElementById('quiz-content').innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">
      문제 ${quizIdx+1} / ${QUIZZES.length}
    </div>
    <div class="quiz-question">${q.q}</div>
    ${q.opts.map((opt,i) =>
      `<button class="quiz-opt" onclick="selectQuizAns(${i},this)">${opt}</button>`
    ).join('')}
  `;
  document.getElementById('quiz-result').style.display = 'none';
}

async function selectQuizAns(idx, btn) {
  const q = QUIZZES[quizIdx];
  document.querySelectorAll('.quiz-opt').forEach(b => b.disabled = true);
  const correct = idx === q.ans;
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) document.querySelectorAll('.quiz-opt')[q.ans].classList.add('correct');
  if (correct) quizScore++;
  document.getElementById('quiz-result').style.display = 'block';
  document.getElementById('quiz-result').innerHTML = `
    <div class="alert ${correct?'alert-success':'alert-error'}" style="margin-top:12px;">
      ${correct?'✅ 정답!':'❌ 오답!'} ${q.exp}
    </div>
    <button class="btn btn-primary btn-sm" onclick="nextQuiz()" style="margin-top:8px;">
      ${quizIdx+1 < QUIZZES.length ? '다음 문제 →' : '결과 보기 →'}
    </button>
  `;
}

async function nextQuiz() {
  quizIdx++;
  if (quizIdx >= QUIZZES.length) {
    await finishQuiz();
  } else {
    showQuiz();
  }
}

async function finishQuiz() {
  const xp = quizScore * 10 + (quizScore === QUIZZES.length ? 20 : 0);
  if (currentUser.uid !== 'student') {
    await addScore(currentUser.uid, xp, '퀘스트1 퀴즈');
    await db.collection('users').doc(currentUser.uid).update({
      'quests.q1_quiz_done': true,
    });
    await db.collection('quiz_results').doc(currentUser.uid).set({
      q1: firebase.firestore.FieldValue.arrayUnion({
        score: quizScore, total: QUIZZES.length,
        xp, date: new Date().toISOString()
      })
    }, {merge:true});
    userData.score = (userData.score||0) + xp;
    updateHUD();
    updateCharImage();
    checkLevelUp(userData.score - xp, userData.score);
  }
  document.getElementById('quiz-content').innerHTML = `
    <div style="text-align:center;padding:20px;">
      <div style="font-size:60px;margin-bottom:16px;">
        ${quizScore === QUIZZES.length ? '🏆' : quizScore >= 2 ? '👍' : '💪'}
      </div>
      <h3 style="font-size:22px;margin-bottom:8px;">${quizScore} / ${QUIZZES.length} 정답</h3>
      <div style="color:var(--accent);font-size:18px;margin-bottom:24px;">+${xp} 점 획득!</div>
      <button class="btn btn-primary" onclick="closeQuiz()">계속 학습하기 →</button>
    </div>
  `;
  document.getElementById('quiz-dots').innerHTML = '';
  document.getElementById('quiz-result').style.display = 'none';
  showXPPopup('+' + xp + ' 점');
}

function closeQuiz() {
  document.getElementById('quiz-overlay').style.display = 'none';
  if (currentUser.uid !== 'student') {
    db.collection('users').doc(currentUser.uid).update({
      'quests.q1_done': true,
      'quests.q1_msgIdx': MESSAGES.length
    });
  }
  showComplete();
}

function showComplete() {
  document.getElementById('dialog-next').style.display = 'none';
  typeText(document.getElementById('dialog-text'),
    '🎉 퀘스트 1 완료! 법률에 대해 잘 배웠어!', () => {
    document.getElementById('dialog-choices').innerHTML = `
      <button class="choice-btn" onclick="window.location.href='quest2.html'">
        다음 퀘스트 →
      </button>
      <button class="choice-btn" onclick="window.location.href='main.html'">
        🏠 메인으로
      </button>
    `;
  });
}

function checkLevelUp(before, after) {
  const lvBefore = getLevelByScore(before);
  const lvAfter  = getLevelByScore(after);
  if (lvAfter.level > lvBefore.level) {
    const el = document.createElement('div');
    el.className = 'levelup-screen';
    el.innerHTML = `
      <img src="${lvAfter.img}" style="height:150px;object-fit:contain;
        filter:drop-shadow(0 0 20px rgba(246,173,85,0.8));animation:charFloat 1s ease-in-out infinite;">
      <h1>레벨 업! 🎉</h1>
      <p>Lv.${lvAfter.level} ${lvAfter.name}</p>
      <button class="btn btn-accent" style="max-width:200px;margin-top:20px;"
        onclick="this.parentElement.remove()">확인</button>
    `;
    document.body.appendChild(el);
  }
}
</script>
</body>
</html>
