<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>퀘스트1 - 인공지능 세계의 법률</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;overflow:hidden;user-select:none;font-family:'Noto Sans KR',sans-serif;}
    .game-screen{position:fixed;inset:0;background:#000;}
    .game-bg{position:absolute;inset:0;background:url('images/bgq1-1.png') center/cover no-repeat;}
    .game-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,0.82) 100%);}

    .ai-notice{position:absolute;top:52px;left:12px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.6);z-index:25;backdrop-filter:blur(4px);max-width:calc(100vw - 24px);}

    .my-char{position:absolute;bottom:clamp(155px,21vw,210px);left:3%;height:clamp(110px,33vh,330px);object-fit:contain;filter:drop-shadow(4px 4px 10px rgba(0,0,0,0.9)) brightness(0.85);animation:charFloat 3s ease-in-out infinite 0.5s;z-index:10;transition:src .4s;}
    .speaker-char{position:absolute;bottom:clamp(155px,21vw,210px);right:3%;height:clamp(110px,33vh,330px);object-fit:contain;filter:drop-shadow(-4px 4px 10px rgba(0,0,0,0.9));animation:charFloat 3s ease-in-out infinite;z-index:10;transition:opacity .4s;}
    @keyframes charFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

    .game-hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);z-index:20;}
    .hud-back{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:7px;padding:5px 10px;color:white;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;}
    .hud-title{font-family:'Jua',sans-serif;font-size:clamp(11px,2.2vw,14px);color:white;text-shadow:0 2px 4px rgba(0,0,0,0.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hud-right{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}
    .hud-score{background:rgba(99,179,237,0.25);border:1px solid rgba(99,179,237,0.4);border-radius:20px;padding:4px 10px;font-size:12px;color:#63b3ed;font-weight:700;white-space:nowrap;}
    .hud-progress{background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.7);white-space:nowrap;}

    .dialog-box{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 clamp(8px,3vw,20px) clamp(10px,2vh,16px);}
    .dialog-top-bar{display:flex;align-items:center;gap:8px;margin-bottom:0;}
    .char-name-tag{display:inline-block;background:linear-gradient(135deg,#63b3ed,#4299e1);color:#0a0e1a;font-weight:700;font-family:'Jua',sans-serif;padding:5px 16px;border-radius:10px 10px 0 0;font-size:clamp(12px,3vw,15px);box-shadow:0 -2px 10px rgba(99,179,237,0.3);transition:background .4s;}
    .char-name-tag.speaker2{background:linear-gradient(135deg,#f6ad55,#ed8936);}
    .btn-prev{margin-left:auto;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:4px 10px;color:rgba(255,255,255,0.7);font-size:12px;cursor:pointer;font-family:inherit;display:none;align-items:center;gap:4px;transition:all .2s;}
    .btn-prev:hover{background:rgba(255,255,255,0.2);}
    .dialog-text-box{background:rgba(10,14,26,0.94);border:2px solid rgba(99,179,237,0.4);border-radius:0 12px 12px 12px;padding:clamp(14px,2.5vw,20px) clamp(40px,6vw,55px) clamp(14px,2.5vw,20px) clamp(14px,2.5vw,22px);position:relative;min-height:clamp(90px,13vh,125px);max-height:clamp(150px,26vh,220px);overflow-y:auto;backdrop-filter:blur(10px);box-shadow:0 -4px 30px rgba(0,0,0,0.5);}
    .dialog-text{font-size:clamp(14px,2.4vw,17px);line-height:1.85;color:#e2e8f0;text-shadow:0 1px 3px rgba(0,0,0,0.5);white-space:pre-line;}
    .dialog-next{position:absolute;bottom:12px;right:12px;width:26px;height:26px;background:rgba(99,179,237,0.2);border:2px solid rgba(99,179,237,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:arrowBounce 1s ease-in-out infinite;}
    .dialog-next::after{content:'▼';font-size:10px;color:#63b3ed;}
    @keyframes arrowBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}

    /* ══ 퀴즈 팝업 ══ */
    .quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);}
    .quiz-box{background:#111827;border:1px solid rgba(99,179,237,0.3);border-radius:20px;width:100%;max-width:540px;padding:clamp(18px,3vw,28px);animation:slideUp .4s ease;box-shadow:0 0 80px rgba(99,179,237,0.15);max-height:92vh;overflow-y:auto;}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
    .quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .quiz-header h2{font-family:'Jua',sans-serif;font-size:clamp(16px,3vw,20px);color:#63b3ed;}
    .quiz-step{font-size:12px;color:rgba(255,255,255,0.4);margin-left:auto;}
    .quiz-progress{display:flex;gap:5px;margin-bottom:14px;}
    .quiz-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15);transition:background .3s;}
    .quiz-dot.done{background:#68d391;}.quiz-dot.cur{background:#63b3ed;}
    .quiz-question{font-size:clamp(14px,2.5vw,16px);font-weight:600;margin:12px 0;line-height:1.6;color:#e2e8f0;}

    /* 객관식 */
    .quiz-opt{width:100%;padding:11px 14px;background:rgba(255,255,255,0.06);border:2px solid rgba(99,179,237,0.2);border-radius:11px;color:#e2e8f0;font-size:clamp(13px,2.3vw,14px);cursor:pointer;margin-bottom:8px;text-align:left;font-family:inherit;transition:all .2s;}
    .quiz-opt:hover{border-color:#63b3ed;background:rgba(99,179,237,0.1);}
    .quiz-opt.correct{border-color:#68d391;background:rgba(104,211,145,0.15);}
    .quiz-opt.wrong{border-color:#fc8181;background:rgba(252,129,129,0.15);}

    /* 드래그앤드롭 */
    .dnd-wrap{display:flex;gap:12px;flex-wrap:wrap;}
    .dnd-col{flex:1;min-width:140px;}
    .dnd-col h4{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
    .dnd-item{background:rgba(99,179,237,0.1);border:2px solid rgba(99,179,237,0.25);border-radius:9px;padding:9px 12px;margin-bottom:7px;cursor:grab;font-size:clamp(12px,2vw,13px);color:#e2e8f0;transition:all .2s;display:flex;align-items:center;gap:7px;}
    .dnd-item:hover{background:rgba(99,179,237,0.2);border-color:rgba(99,179,237,0.5);}
    .dnd-item.dragging{opacity:0.35;}
    .drag-handle{color:rgba(255,255,255,0.3);font-size:14px;}
    .dnd-slot{background:rgba(255,255,255,0.04);border:2px dashed rgba(255,255,255,0.15);border-radius:9px;padding:9px 12px;margin-bottom:7px;min-height:42px;font-size:clamp(12px,2vw,13px);color:rgba(255,255,255,0.3);transition:all .2s;display:flex;align-items:center;}
    .dnd-slot.over{background:rgba(99,179,237,0.1);border-color:rgba(99,179,237,0.4);}
    .dnd-slot.filled{background:rgba(99,179,237,0.08);border:2px solid rgba(99,179,237,0.3);color:#e2e8f0;}
    .dnd-slot.correct{background:rgba(104,211,145,0.15);border:2px solid #68d391;color:#68d391;}
    .dnd-slot.wrong{background:rgba(252,129,129,0.15);border:2px solid #fc8181;color:#fc8181;}

    .quiz-check-btn{width:100%;padding:12px;margin-top:12px;background:linear-gradient(135deg,#63b3ed,#4299e1);border:none;border-radius:11px;color:#0a0e1a;font-size:clamp(13px,2.5vw,15px);font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;}
    .quiz-check-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(99,179,237,0.4);}
    .quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:9px;font-size:clamp(12px,2vw,13px);line-height:1.5;}
    .quiz-feedback.correct{background:rgba(104,211,145,0.15);border:1px solid #68d391;color:#68d391;}
    .quiz-feedback.wrong{background:rgba(252,129,129,0.15);border:1px solid #fc8181;color:#fc8181;}
    .quiz-result{text-align:center;padding:16px 0;}
    .quiz-result .big-emoji{font-size:clamp(48px,8vw,64px);margin-bottom:12px;}
    .quiz-result h3{font-size:clamp(18px,3.5vw,22px);margin-bottom:6px;}
    .quiz-result .xp-gain{color:#f6ad55;font-size:clamp(16px,3vw,20px);margin-bottom:16px;}

    .levelup-screen{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
    .levelup-screen h1{font-family:'Jua',sans-serif;font-size:clamp(32px,6vw,48px);color:#f6ad55;}
    .levelup-screen p{font-size:clamp(16px,3vw,20px);color:#63b3ed;}
    .xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#63b3ed,#f6ad55);color:#0a0e1a;font-weight:700;font-size:clamp(18px,4vw,24px);padding:14px 36px;border-radius:18px;z-index:500;animation:popIn .4s ease,fadeOutUp .5s ease 1.5s forwards;pointer-events:none;}
    @keyframes popIn{from{transform:translate(-50%,-50%) scale(.5);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
    @keyframes fadeOutUp{to{opacity:0;transform:translate(-50%,-70%);}}
    @media(max-width:480px){.my-char,.speaker-char{height:clamp(90px,25vh,180px);}.dnd-wrap{flex-direction:column;}}
  </style>
</head>
<body>

<div id="quiz-overlay" class="quiz-overlay" style="display:none;">
  <div class="quiz-box">
    <div class="quiz-header">
      <h2 id="quiz-title">퀴즈!</h2>
      <span class="quiz-step" id="quiz-step"></span>
    </div>
    <div class="quiz-progress" id="quiz-dots"></div>
    <div id="quiz-content"></div>
  </div>
</div>

<div class="game-screen">
  <div class="game-bg"></div>
  <div class="ai-notice">본 프로그램의 배경과 캐릭터는 AI로 생성되었습니다.</div>
  <img class="my-char" id="my-char" src="images/robot_1.png" alt="내캐릭터">
  <img class="speaker-char" id="speaker-char" src="images/char1-1.png" alt="캐릭터">

  <div class="game-hud">
    <a href="main.html" class="hud-back">← 메인</a>
    <div class="hud-title">⚖️ 퀘스트 1: 인공지능 세계의 법률</div>
    <div class="hud-right">
      <div class="hud-progress" id="hud-progress">1 / 11</div>
      <div class="hud-score" id="hud-score">0 점</div>
    </div>
  </div>

  <div class="dialog-box">
    <div class="dialog-top-bar">
      <div class="char-name-tag" id="dialog-name">AI 가디언</div>
      <button class="btn-prev" id="btn-prev" onclick="prevMessage()">◀ 이전</button>
    </div>
    <div class="dialog-text-box">
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-next" id="dialog-next" onclick="nextMessage()"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const MESSAGES = [
  { speaker:1, name:"AI 가디언", text:"여기는 대한민국 인공지능 세계야 🌏\n여기에서 살아가려면 법을 알고 있어야겠지? ⚖️\n여기 세계의 법을 알려줄게!" },
  { speaker:1, name:"AI 가디언", text:"나는 AI로 만들어진 캐릭터야 🤖\nAI로 생성된 사실을 알려줘야 해.\n대한민국에서 2026년 1월 22일부터 시행되었지! 📅" },
  { speaker:1, name:"AI 가디언", text:"AI로 만들어진 광고를 보면 아래에\n\"본 광고는 AI로 만들어졌습니다.\"라고 표기되어 있지.\n이미지, 동영상, 오디오 콘텐츠 모두 포함이야! 🎬\n실제와 구분이 어렵다면 잘 보이도록 표시해야 하지." },
  { speaker:1, name:"AI 가디언", text:"개인정보 보호법에 대해 알아볼까? 🔒\nAI가 더 똑똑해지려면 많은 정보를 학습해야 해.\n자, 지금까지 배운 내용 퀴즈로 확인해보자!", type:"quiz_1" },
  { speaker:2, name:"씨큐", text:"안녕! 나는 씨큐야 😊\n좋은 AI가 되기 위해서는 많은 정보가 필요해!\n하지만 아무 정보나 공부할 순 없지." },
  { speaker:2, name:"씨큐", text:"인공지능은 마치 '엄청난 공부벌레'와 같아. 📚\n수많은 데이터를 읽고 학습해야 하는데,\n우리가 일상에서 남긴 기록들이 사용되지." },
  { speaker:2, name:"씨큐", text:"학습 데이터는 AI가 배우는 교과서야. 📖\nSNS 게시글, 검색 기록 등도 포함되지.\n개인정보는 이름, 주소뿐만 아니라\n취향, 위치, 목소리, 얼굴 특징까지 포함돼!" },
  { speaker:2, name:"씨큐", text:"AI시대 개인정보 보호 3대 핵심 원칙을 알려줄게! ⚖️\n법은 AI가 무분별하게 정보를 가져가지 못하도록\n다음 규칙을 정하고 있어." },
  { speaker:2, name:"씨큐", text:"[① 투명성] 내 정보를 어디에 쓰는지 알려줘!\n어떤 정보를 어떻게 학습시키는지\n사용자에게 명확하게 알려줘야 해. 약관에 숨기면 안 돼!!" },
  { speaker:2, name:"씨큐", text:"[② 목적 제한] 공부하라고 준 정보로 딴짓하지 마!\n학습용 앱이 성적 데이터를 광고 회사에 파는 건 불법!\n\n[③ 안전성] 내 정보가 새나가지 않게 꽉 잠가줘! 🔒\n익명화(비식별화) 처리를 철저히 해야 해." },
  { speaker:2, name:"씨큐", text:"자, 씨큐가 알려준 내용을 퀴즈로 확인해볼까? 🎮\n잘 들었으면 맞힐 수 있을 거야!", type:"quiz_2" },
];

// 퀴즈1 - 드래그앤드롭 3문제
const QUIZZES_1 = [
  { type:"order", title:"AI 콘텐츠 표시 규칙 순서 맞추기",
    desc:"AI 콘텐츠 표시와 관련된 내용을 올바른 순서로 배치하세요!",
    items:[
      { id:"a", text:"AI 콘텐츠 표시법 시행 (2026.01.22)" },
      { id:"b", text:"AI 생성 광고에 표기 의무 발생" },
      { id:"c", text:"이미지·동영상·오디오 모두 적용" },
    ],
    answer:["a","b","c"],
    exp:"시행 → 광고 표기 의무 → 모든 미디어 적용 순서입니다!" },
  { type:"match", title:"AI 법률 내용 짝 맞추기",
    desc:"각 상황에 맞는 원칙을 연결하세요!",
    left:[
      { id:"l1", text:"📢 AI 광고에 생성 사실 표시" },
      { id:"l2", text:"🎥 AI 동영상에 표기 없음" },
      { id:"l3", text:"🔊 AI 오디오 콘텐츠에 표기" },
    ],
    right:[
      { id:"r1", text:"법률 준수" },
      { id:"r2", text:"법률 위반" },
      { id:"r3", text:"법률 준수" },
    ],
    answer:{ l1:"r1", l2:"r2", l3:"r3" },
    exp:"AI 생성 콘텐츠에는 반드시 표기해야 해요. 표기 없음은 위반!" },
  { type:"order", title:"개인정보 3대 원칙 순서 맞추기",
    desc:"AI시대 개인정보 보호 3대 원칙을 순서대로 배치하세요!",
    items:[
      { id:"a", text:"① 투명성 - 정보 사용 목적 명시" },
      { id:"b", text:"② 목적 제한 - 정해진 목적 외 금지" },
      { id:"c", text:"③ 안전성 - 익명화 처리" },
    ],
    answer:["a","b","c"],
    exp:"투명성 → 목적 제한 → 안전성 순서가 맞습니다!" },
];

// 퀴즈2 - 객관식 3문제 (씨큐)
const QUIZZES_2 = [
  { type:"mc", q:"개인정보에 포함되는 것이 아닌 것은?",
    opts:["나의 취향과 위치","목소리와 얼굴 특징","이름과 주소","오늘 날씨"],
    ans:3, exp:"개인정보는 특정 개인을 식별할 수 있는 정보입니다. 날씨는 해당 없어요!" },
  { type:"mc", q:"학습용 앱이 성적 데이터를 광고 회사에 파는 것은?",
    opts:["투명성 원칙 위반","목적 제한 위반","안전성 원칙 위반","법률 준수"],
    ans:1, exp:"정해진 목적(성적 분석) 외로 사용하는 것은 목적 제한 위반입니다!" },
  { type:"mc", q:"AI가 학습한 데이터에서 개인을 찾아낼 수 없도록 하는 처리는?",
    opts:["암호화","백업","익명화(비식별화)","압축"],
    ans:2, exp:"익명화(비식별화) 처리는 안전성 원칙의 핵심입니다!" },
];

let currentUser=null, userData=null;
let msgIdx=0, isTyping=false, typingTimer=null;
let currentQuizSet=null, quizIdx=0, quizScore=0, quizAttempts=0;
let orderSlots={}, matchMap={}, currentDragId=null, touchDragId=null, touchClone=null;

requireAuth(async (user) => {
  currentUser=user;
  if(user.uid==='student'){
    userData={charName:'AI',score:0,quests:{}};
  } else {
    const snap=await db.collection('users').where('id','==',user.id).get();
    if(!snap.empty){userData=snap.docs[0].data();currentUser.uid=snap.docs[0].id;}
  }
  updateHUD(); updateCharImages();
  const saved=(userData.quests||{}).q1_msgIdx||0;
  msgIdx=Math.min(saved,MESSAGES.length-1);
  setTimeout(()=>showMessage(msgIdx),500);
});

function updateCharImages(){
  const lv=getLevelByScore(userData.score||0);
  document.getElementById('my-char').src=lv.img;
}
function updateHUD(){
  document.getElementById('hud-score').textContent=(userData.score||0)+' 점';
  document.getElementById('hud-progress').textContent=`${msgIdx+1} / ${MESSAGES.length}`;
}

function showMessage(idx){
  if(idx>=MESSAGES.length){showComplete();return;}
  const msg=MESSAGES[idx];
  document.getElementById('hud-progress').textContent=`${idx+1} / ${MESSAGES.length}`;
  document.getElementById('btn-prev').style.display=idx>0?'flex':'none';

  const nameTag=document.getElementById('dialog-name');
  nameTag.textContent=msg.name;
  if(msg.speaker===2){nameTag.classList.add('speaker2');document.getElementById('speaker-char').src='images/char1-2.png';}
  else{nameTag.classList.remove('speaker2');document.getElementById('speaker-char').src='images/char1-1.png';}

  const textEl=document.getElementById('dialog-text');
  document.getElementById('dialog-next').style.display='flex';

  typeText(textEl, msg.text, ()=>{
    if(msg.type==='quiz_1'){
      document.getElementById('dialog-next').style.display='none';
      // 자동으로 퀴즈 팝업
      setTimeout(()=>startQuiz(1), 600);
    } else if(msg.type==='quiz_2'){
      document.getElementById('dialog-next').style.display='none';
      setTimeout(()=>startQuiz(2), 600);
    }
  });
}

function typeText(el,text,cb){
  el.textContent=''; isTyping=true;
  document.getElementById('dialog-next').style.opacity='0.3';
  let i=0;
  typingTimer=setInterval(()=>{
    if(i<text.length){el.textContent=text.slice(0,i+1);i++;}
    else{
      clearInterval(typingTimer);
      el.textContent=text; isTyping=false;
      document.getElementById('dialog-next').style.opacity='1';
      if(cb) cb();
    }
  },22);
}

function nextMessage(){
  if(isTyping){
    clearInterval(typingTimer);
    const msg=MESSAGES[msgIdx];
    document.getElementById('dialog-text').textContent=msg.text;
    isTyping=false;
    document.getElementById('dialog-next').style.opacity='1';
    if(msg.type==='quiz_1'){document.getElementById('dialog-next').style.display='none';setTimeout(()=>startQuiz(1),400);}
    else if(msg.type==='quiz_2'){document.getElementById('dialog-next').style.display='none';setTimeout(()=>startQuiz(2),400);}
    return;
  }
  msgIdx++; autoSave(); showMessage(msgIdx);
}

function prevMessage(){
  if(isTyping){clearInterval(typingTimer);isTyping=false;}
  if(msgIdx>0){msgIdx--;showMessage(msgIdx);}
}

async function autoSave(){
  if(currentUser.uid==='student') return;
  await db.collection('users').doc(currentUser.uid).update({'quests.q1_msgIdx':msgIdx});
}

document.addEventListener('click',(e)=>{
  if(e.target.closest('.quiz-overlay')||e.target.closest('.dialog-next')||
     e.target.closest('.hud-back')||e.target.closest('.btn-prev')) return;
  nextMessage();
});
document.addEventListener('keydown',(e)=>{
  if(e.code==='Space'||e.code==='Enter') nextMessage();
  if(e.code==='ArrowLeft') prevMessage();
});

// ══ 퀴즈 ══
function startQuiz(setNum){
  currentQuizSet=setNum===1?QUIZZES_1:QUIZZES_2;
  quizIdx=0; quizScore=0; quizAttempts=0;
  document.getElementById('quiz-title').textContent=setNum===1?'🎮 드래그 퀴즈!':'📝 씨큐 퀴즈!';
  document.getElementById('quiz-overlay').style.display='flex';
  renderQuiz();
}

function renderQuiz(){
  const q=currentQuizSet[quizIdx];
  document.getElementById('quiz-step').textContent=`${quizIdx+1} / ${currentQuizSet.length}`;
  document.getElementById('quiz-dots').innerHTML=currentQuizSet.map((_,i)=>
    `<div class="quiz-dot ${i<quizIdx?'done':i===quizIdx?'cur':''}"></div>`
  ).join('');
  if(q.type==='mc') renderMC(q);
  else if(q.type==='order') renderOrder(q);
  else renderMatch(q);
}

// 객관식
function renderMC(q){
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-question">${q.q}</div>
    ${q.opts.map((opt,i)=>`<button class="quiz-opt" onclick="selectMC(${i},this)">${opt}</button>`).join('')}
    <div id="quiz-feedback"></div>`;
}
function selectMC(idx,btn){
  const q=currentQuizSet[quizIdx];
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const ok=idx===q.ans;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) document.querySelectorAll('.quiz-opt')[q.ans].classList.add('correct');
  if(ok) quizScore++;
  quizAttempts++;
  document.getElementById('quiz-feedback').innerHTML=`
    <div class="quiz-feedback ${ok?'correct':'wrong'}" style="margin-top:10px;">
      ${ok?'✅ 정답!':'❌ 오답!'} ${q.exp}
    </div>
    <button class="quiz-check-btn" onclick="nextQuiz()">
      ${quizIdx+1<currentQuizSet.length?'다음 문제 →':'결과 보기 →'}
    </button>`;
}

// 순서 맞추기
function renderOrder(q){
  orderSlots={};
  const shuffled=[...q.items].sort(()=>Math.random()-.5);
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-question">${q.title}</div>
    <p style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:12px;">${q.desc}</p>
    <div class="dnd-wrap">
      <div class="dnd-col"><h4>📦 항목</h4>
        ${shuffled.map(item=>`
          <div class="dnd-item" id="item-${item.id}" draggable="true"
            ondragstart="dragStart(event,'${item.id}')" ondragend="dragEnd(event)"
            ontouchstart="touchStart(event,'${item.id}')" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">
            <span class="drag-handle">⠿</span>${item.text}</div>`).join('')}
      </div>
      <div class="dnd-col"><h4>✅ 순서</h4>
        ${[1,2,3].map(n=>`
          <div class="dnd-slot" id="slot-${n}" data-slot="${n}"
            ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropOrder(event,${n})">
            ${n}번째</div>`).join('')}
      </div>
    </div>
    <div id="quiz-feedback"></div>
    <button class="quiz-check-btn" id="check-btn" onclick="checkOrder()">✅ 정답 확인</button>`;
}
function checkOrder(){
  const q=currentQuizSet[quizIdx]; let ok=true;
  [1,2,3].forEach((n,i)=>{
    const s=document.getElementById('slot-'+n);
    if(orderSlots[n]===q.answer[i]) s.classList.add('correct');
    else{s.classList.add('wrong');ok=false;}
  });
  if(ok) quizScore++;
  quizAttempts++;
  document.getElementById('quiz-feedback').innerHTML=`
    <div class="quiz-feedback ${ok?'correct':'wrong'}" style="margin-top:10px;">
      ${ok?'🎉 완벽해요!':'❌ 아쉬워요!'} ${q.exp}
    </div>
    <button class="quiz-check-btn" onclick="nextQuiz()">
      ${quizIdx+1<currentQuizSet.length?'다음 문제 →':'결과 보기 →'}
    </button>`;
  document.getElementById('check-btn').style.display='none';
}

// 짝 맞추기
function renderMatch(q){
  matchMap={};
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-question">${q.title}</div>
    <p style="font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:12px;">${q.desc}</p>
    <div class="dnd-wrap">
      <div class="dnd-col"><h4>상황</h4>
        ${q.left.map(item=>`
          <div class="dnd-item" id="item-${item.id}" draggable="true"
            ondragstart="dragStart(event,'${item.id}')" ondragend="dragEnd(event)"
            ontouchstart="touchStart(event,'${item.id}')" ontouchmove="touchMove(event)" ontouchend="touchEnd(event)">
            <span class="drag-handle">⠿</span>${item.text}</div>`).join('')}
      </div>
      <div class="dnd-col"><h4>원칙</h4>
        ${q.right.map(r=>`
          <div class="dnd-slot" id="rslot-${r.id}" data-rid="${r.id}"
            ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropMatch(event,'${r.id}')">
            ${r.text}</div>`).join('')}
      </div>
    </div>
    <div id="quiz-feedback"></div>
    <button class="quiz-check-btn" id="check-btn" onclick="checkMatch()">✅ 정답 확인</button>`;
}
function checkMatch(){
  const q=currentQuizSet[quizIdx]; let ok=true;
  q.left.forEach(l=>{
    const rid=matchMap[l.id];
    const slot=rid?document.getElementById('rslot-'+rid):null;
    if(rid&&q.answer[l.id]===rid) slot?.classList.add('correct');
    else{if(slot)slot.classList.add('wrong');ok=false;}
  });
  if(ok) quizScore++;
  quizAttempts++;
  document.getElementById('quiz-feedback').innerHTML=`
    <div class="quiz-feedback ${ok?'correct':'wrong'}" style="margin-top:10px;">
      ${ok?'🎉 완벽해요!':'❌ 아쉬워요!'} ${q.exp}
    </div>
    <button class="quiz-check-btn" onclick="nextQuiz()">
      ${quizIdx+1<currentQuizSet.length?'다음 문제 →':'결과 보기 →'}
    </button>`;
  document.getElementById('check-btn').style.display='none';
}

async function nextQuiz(){
  quizIdx++; orderSlots={}; matchMap={};
  if(quizIdx>=currentQuizSet.length) await finishQuiz();
  else renderQuiz();
}

async function finishQuiz(){
  const total=currentQuizSet.length;
  const xp=quizScore*12+(quizScore===total?20:0);
  const quizName=currentQuizSet===QUIZZES_1?'q1_드래그퀴즈':'q1_씨큐퀴즈';

  if(currentUser.uid!=='student'){
    await addScore(currentUser.uid,xp,'퀘스트1 퀴즈');

    // 퀴즈 결과 저장 (문제 푼 횟수, 정답 수, 정답률)
    const resultData={
      quizName, score:quizScore, total,
      attempts:quizAttempts,
      accuracy:Math.round(quizScore/total*100),
      xp, date:new Date().toISOString()
    };
    await db.collection('quiz_results').doc(currentUser.uid).set({
      [quizName]:firebase.firestore.FieldValue.arrayUnion(resultData)
    },{merge:true});

    // 유저 통계 업데이트
    await db.collection('users').doc(currentUser.uid).update({
      [`quests.${quizName}_done`]:true,
      'stats.total_quiz_attempts':firebase.firestore.FieldValue.increment(1),
      'stats.total_correct':firebase.firestore.FieldValue.increment(quizScore),
    });

    userData.score=(userData.score||0)+xp;
    updateHUD(); updateCharImages();
    checkLevelUp(userData.score-xp,userData.score);
  }

  document.getElementById('quiz-dots').innerHTML='';
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-result">
      <div class="big-emoji">${quizScore===total?'🏆':quizScore>=Math.ceil(total/2)?'👍':'💪'}</div>
      <h3>${quizScore} / ${total} 정답</h3>
      <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;">정답률 ${Math.round(quizScore/total*100)}%</div>
      <div class="xp-gain">+${xp} 점 획득!</div>
      <button class="quiz-check-btn" onclick="closeQuiz()">계속 학습하기 →</button>
    </div>`;
  showXPPopup('+'+xp+' 점');
}

function closeQuiz(){
  document.getElementById('quiz-overlay').style.display='none';
  if(currentQuizSet===QUIZZES_2&&currentUser.uid!=='student'){
    db.collection('users').doc(currentUser.uid).update({'quests.q1_done':true,'quests.q1_msgIdx':MESSAGES.length});
    showComplete(); return;
  }
  msgIdx++; autoSave(); showMessage(msgIdx);
}

function showComplete(){
  document.getElementById('dialog-next').style.display='none';
  document.getElementById('speaker-char').src='images/char1-2.png';
  typeText(document.getElementById('dialog-text'),
    '🎉 퀘스트 1 완료!\n법률에 대해 잘 배웠어!\n다음 퀘스트로 넘어가볼까?',()=>{
    document.getElementById('dialog-next').style.display='none';
    const div=document.createElement('div');
    div.style.cssText='display:flex;flex-direction:column;gap:7px;margin-top:8px;';
    div.innerHTML=`
      <button class="choice-btn" onclick="window.location.href='quest2.html'">다음 퀘스트 →</button>
      <button class="choice-btn" onclick="window.location.href='main.html'">🏠 메인으로</button>`;
    document.querySelector('.dialog-box').appendChild(div);
  });
}

function checkLevelUp(before,after){
  const lvB=getLevelByScore(before),lvA=getLevelByScore(after);
  if(lvA.level>lvB.level){
    const el=document.createElement('div');
    el.className='levelup-screen';
    el.innerHTML=`<img src="${lvA.img}" style="height:130px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(246,173,85,0.8));">
      <h1>레벨 업! 🎉</h1><p>Lv.${lvA.level} ${lvA.name}</p>
      <button class="quiz-check-btn" style="max-width:200px;margin-top:14px;" onclick="this.parentElement.remove()">확인</button>`;
    document.body.appendChild(el);
  }
}

// 드래그
function dragStart(e,id){currentDragId=id;e.dataTransfer.setData('text',id);setTimeout(()=>document.getElementById('item-'+id)?.classList.add('dragging'),0);}
function dragEnd(){document.querySelectorAll('.dnd-item').forEach(el=>el.classList.remove('dragging'));}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over');}
function dragLeave(e){e.currentTarget.classList.remove('over');}
function dropOrder(e,n){
  e.preventDefault();e.currentTarget.classList.remove('over');
  const id=e.dataTransfer.getData('text')||currentDragId;
  const item=currentQuizSet[quizIdx].items?.find(i=>i.id===id);if(!item)return;
  orderSlots[n]=id;
  const s=document.getElementById('slot-'+n);s.textContent=item.text;s.classList.add('filled');
}
function dropMatch(e,rid){
  e.preventDefault();e.currentTarget.classList.remove('over');
  const lid=e.dataTransfer.getData('text')||currentDragId;
  const q=currentQuizSet[quizIdx];
  const left=q.left?.find(i=>i.id===lid);if(!left)return;
  Object.keys(matchMap).forEach(k=>{if(matchMap[k]===rid)delete matchMap[k];});
  matchMap[lid]=rid;
  const s=document.getElementById('rslot-'+rid);
  s.textContent=left.text+' → '+q.right.find(r=>r.id===rid).text;s.classList.add('filled');
}
// 터치
function touchStart(e,id){touchDragId=id;const el=document.getElementById('item-'+id);touchClone=el.cloneNode(true);touchClone.style.cssText=`position:fixed;opacity:0.8;pointer-events:none;z-index:999;width:${el.offsetWidth}px;background:#1a2235;border-radius:9px;padding:9px 12px;font-size:13px;color:#e2e8f0;`;document.body.appendChild(touchClone);}
function touchMove(e){e.preventDefault();const t=e.touches[0];if(touchClone){touchClone.style.left=(t.clientX-60)+'px';touchClone.style.top=(t.clientY-20)+'px';}document.querySelectorAll('.dnd-slot').forEach(s=>s.classList.remove('over'));document.elementFromPoint(t.clientX,t.clientY)?.closest('.dnd-slot')?.classList.add('over');}
function touchEnd(e){
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.dnd-slot').forEach(s=>s.classList.remove('over'));
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.dnd-slot');
  if(!el||!touchDragId)return;
  const q=currentQuizSet[quizIdx];
  if(q.type==='order'){
    const n=parseInt(el.dataset.slot);
    const item=q.items?.find(i=>i.id===touchDragId);
    if(item){orderSlots[n]=touchDragId;el.textContent=item.text;el.classList.add('filled');}
  } else {
    const rid=el.dataset.rid;
    const left=q.left?.find(i=>i.id===touchDragId);
    if(left&&rid){matchMap[touchDragId]=rid;el.textContent=left.text+' → '+q.right.find(r=>r.id===rid).text;el.classList.add('filled');}
  }
  touchDragId=null;
}
</script>
