<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>관리자 페이지 👑</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
<button class="hamburger" onclick="toggleSidebar()">☰</button>
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">👑 관리자</div>
    <div style="padding:0 8px;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;margin-bottom:16px;">
        <div style="font-size:32px;">👑</div>
        <div style="font-weight:700;margin-top:6px;">관리자</div>
      </div>
      <a href="#tab-students" class="quest-item active" onclick="showTab('students')">👥 학생 현황</a>
      <a href="#tab-quiz" class="quest-item" onclick="showTab('quiz')">📝 퀴즈 결과</a>
      <a href="#tab-board" class="quest-item" onclick="showTab('board')">📋 게시판 관리</a>
      <a href="#tab-stats" class="quest-item" onclick="showTab('stats')">📊 전체 통계</a>
    </div>
    <button class="btn btn-ghost" onclick="logout()"
      style="margin-top:auto;padding:10px;font-size:13px;">🚪 로그아웃</button>
  </aside>

  <main class="main-content">
    <h2 style="font-family:'Jua',sans-serif;font-size:24px;margin-bottom:24px;">
      👑 관리자 페이지
    </h2>

    <!-- 통계 카드 -->
    <div class="stat-cards" id="stat-cards">
      <div class="stat-card"><div class="num" id="stat-total">-</div><div class="lbl">총 학생 수</div></div>
      <div class="stat-card"><div class="num" id="stat-active">-</div><div class="lbl">퀘스트 진행 중</div></div>
      <div class="stat-card"><div class="num" id="stat-quiz-total">-</div><div class="lbl">총 퀴즈 응시</div></div>
      <div class="stat-card"><div class="num" id="stat-avg-score">-</div><div class="lbl">평균 점수</div></div>
    </div>

    <!-- 학생 현황 탭 -->
    <div id="tab-students">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
          <h3>👥 학생 현황</h3>
          <button class="btn btn-ghost btn-sm" onclick="loadData()">🔄 새로고침</button>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>학번</th><th>이름</th><th>아이디</th>
                <th>캐릭터명</th><th>레벨</th><th>점수</th>
                <th>퀘스트 진행</th><th>가입일</th>
              </tr>
            </thead>
            <tbody id="student-tbody">
              <tr><td colspan="8" style="text-align:center;padding:40px;">
                <div class="spinner" style="margin:0 auto;"></div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 퀴즈 결과 탭 -->
    <div id="tab-quiz" style="display:none;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);">
          <h3>📝 퀴즈 결과</h3>
        </div>
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>학번</th><th>이름</th><th>퀴즈명</th>
                <th>응시횟수</th><th>최고점수</th><th>평균점수</th>
                <th>평균정답률</th><th>마지막 응시</th>
              </tr>
            </thead>
            <tbody id="quiz-tbody">
              <tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">
                데이터 로딩 중...
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- 게시판 관리 탭 -->
    <div id="tab-board" style="display:none;">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <h3>📋 게시판 관리</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-ghost btn-sm" onclick="loadBoardAdmin('board_q1')" id="btn-q1" style="font-size:12px;padding:6px 12px;">
              ⚖️ 퀘스트1 게시판
            </button>
            <button class="btn btn-ghost btn-sm" onclick="loadBoardAdmin('board_q2')" id="btn-q2" style="font-size:12px;padding:6px 12px;">
              🔍 퀘스트2 게시판
            </button>
          </div>
        </div>
        <div style="padding:16px 20px;">
          <div id="board-admin-title" style="font-size:13px;color:var(--muted);margin-bottom:14px;">
            퀘스트를 선택해주세요.
          </div>
          <div id="board-admin-list"></div>
        </div>
      </div>
    </div>

    <!-- 전체 통계 탭 -->
    <div id="tab-stats" style="display:none;">
      <div class="chat-box" style="max-width:500px;">
        <div class="chat-header"><h3>📊 전체 통계</h3></div>
        <div style="padding:24px;" id="stats-content">
          <div class="loading"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAdmin(async () => { loadData(); });

async function loadData() {
  const [usersSnap, quizSnap] = await Promise.all([
    db.collection('users').orderBy('created_at','desc').get(),
    db.collection('quiz_results').get()
  ]);

  const users = usersSnap.docs.map(d => ({...d.data(), _id: d.id}));
  const quizMap = {};
  quizSnap.docs.forEach(d => { quizMap[d.id] = d.data(); });

  // 통계 카드
  const totalScore = users.reduce((s,u) => s+(u.score||0), 0);
  const avgScore = users.length ? Math.round(totalScore/users.length) : 0;
  const activeUsers = users.filter(u => Object.keys(u.quests||{}).length > 0).length;
  const totalQuiz = Object.values(quizMap).reduce((s,u) => {
    return s + Object.values(u).reduce((s2,arr) => s2+(Array.isArray(arr)?arr.length:0), 0);
  }, 0);

  document.getElementById('stat-total').textContent = users.length;
  document.getElementById('stat-active').textContent = activeUsers;
  document.getElementById('stat-quiz-total').textContent = totalQuiz;
  document.getElementById('stat-avg-score').textContent = avgScore;

  // 학생 테이블
  document.getElementById('student-tbody').innerHTML = users.length === 0
    ? '<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">등록된 학생이 없습니다</td></tr>'
    : users.map(u => {
        const lv = getLevelByScore(u.score||0);
        const questDone = Object.keys(u.quests||{}).filter(k=>k.endsWith('_done')).length;
        return `<tr>
          <td>${u.stunum||'-'}</td>
          <td>${u.name||'-'}</td>
          <td><code style="background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;">${u.id||'-'}</code></td>
          <td>${u.charName||'미설정'}</td>
          <td><span style="color:var(--accent);">Lv.${lv.level}</span> ${lv.emoji}</td>
          <td><strong style="color:var(--primary);">${u.score||0}</strong></td>
          <td>${questDone} / 8 완료</td>
          <td style="color:var(--muted);font-size:12px;">${(u.created_at||'').slice(0,10)}</td>
        </tr>`;
      }).join('');

  // 퀴즈 테이블
  const quizRows = [];
  users.forEach(u => {
    const qdata = quizMap[u._id] || {};
    Object.entries(qdata).forEach(([questKey, attempts]) => {
      if (!Array.isArray(attempts)) return;
      const scores   = attempts.map(a => a.score);
      const totals   = attempts.map(a => a.total);
      const accuracy = attempts.map(a => a.accuracy || Math.round(a.score/a.total*100));
      const best     = Math.max(...scores);
      const avg      = (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1);
      const avgAcc   = Math.round(accuracy.reduce((a,b)=>a+b,0)/accuracy.length);
      const last     = attempts[attempts.length-1]?.date?.slice(0,16) || '-';
      const accColor = avgAcc>=80?'var(--green)':avgAcc>=60?'var(--accent)':'var(--red)';
      quizRows.push(`<tr>
        <td>${u.stunum||'-'}</td>
        <td>${u.name||'-'}</td>
        <td><code style="background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:4px;font-size:12px;">${questKey}</code></td>
        <td>${attempts.length}회</td>
        <td><strong style="color:var(--green);">${best}/${totals[0]||'?'}</strong></td>
        <td>${avg}점</td>
        <td><strong style="color:${accColor};">${avgAcc}%</strong></td>
        <td style="font-size:12px;color:var(--muted);">${last}</td>
      </tr>`);
    });
  });
  document.getElementById('quiz-tbody').innerHTML = quizRows.length
    ? quizRows.join('')
    : `<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--muted);">퀴즈 기록이 없습니다</td></tr>`;

  // 통계
  const levelDist = {};
  users.forEach(u => {
    const lv = getLevelByScore(u.score||0);
    levelDist[lv.name] = (levelDist[lv.name]||0) + 1;
  });
  document.getElementById('stats-content').innerHTML = `
    <div style="margin-bottom:20px;">
      <h4 style="margin-bottom:12px;color:var(--muted);">레벨 분포</h4>
      ${Object.entries(levelDist).map(([name,cnt]) => `
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
          <span>${name}</span>
          <span style="color:var(--primary);font-weight:700;">${cnt}명</span>
        </div>`).join('')}
    </div>
    <div>
      <h4 style="margin-bottom:12px;color:var(--muted);">점수 현황</h4>
      <div style="display:flex;justify-content:space-between;padding:8px 0;">
        <span>최고 점수</span>
        <span style="color:var(--accent);font-weight:700;">
          ${users.length ? Math.max(...users.map(u=>u.score||0)) : 0}점
        </span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;">
        <span>평균 점수</span>
        <span style="color:var(--primary);font-weight:700;">${avgScore}점</span>
      </div>
    </div>
  `;
}

function showTab(t) {
  ['students','quiz','board','stats'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t?'block':'none';
  });
  document.querySelectorAll('.sidebar .quest-item').forEach((el,i) => {
    el.classList.toggle('active', ['students','quiz','board','stats'][i]===t);
  });
  if(t==='board') loadBoardAdmin('board_q1');
}

let currentBoardCollection = 'board_q1';
async function loadBoardAdmin(col){
  currentBoardCollection = col;
  // 버튼 활성화
  document.getElementById('btn-q1').style.background = col==='board_q1'?'rgba(99,179,237,0.2)':'';
  document.getElementById('btn-q2').style.background = col==='board_q2'?'rgba(99,179,237,0.2)':'';

  const titles = { board_q1:'퀘스트1 - 인공지능시대 법률/윤리', board_q2:'퀘스트2 - 인공지능 관련 인물 업적' };
  document.getElementById('board-admin-title').innerHTML =
    `<strong style="color:var(--primary);">${titles[col]||col}</strong> 게시글 목록`;

  const list = document.getElementById('board-admin-list');
  list.innerHTML = `<div style="text-align:center;padding:30px;"><div class="spinner" style="margin:0 auto;"></div></div>`;

  try {
    const snap = await db.collection(col).orderBy('created_at','desc').limit(50).get();
    if (snap.empty) {
      list.innerHTML = `<div style="text-align:center;padding:30px;color:var(--muted);">게시글이 없습니다.</div>`;
      return;
    }

    // 유저 목록 (점수 업데이트용)
    const usersSnap = await db.collection('users').get();
    const userMap = {};
    usersSnap.docs.forEach(d => { userMap[d.id] = {...d.data(), _id:d.id}; });

    list.innerHTML = snap.docs.map(doc => {
      const d = doc.data();
      const date = d.created_at?.slice(0,16).replace('T',' ')||'';
      const xp = d.xp || BOARD_DEFAULT_XP;
      // 실명 찾기
      const user = d.isTemp ? null : userMap[d.authorId];
      const nameLabel = user
        ? `${user.name} (${user.id})`
        : `${d.authorName}${d.isTemp?' [임시]':''}`;

      return `
        <div id="apost-${doc.id}" style="background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            <div>
              <span style="font-size:13px;font-weight:700;color:var(--text);">${nameLabel}</span>
              <span style="font-size:11px;color:var(--muted);margin-left:8px;">${date}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <!-- 점수 조정 -->
              <div style="display:flex;align-items:center;gap:4px;">
                <label style="font-size:12px;color:var(--muted);">점수:</label>
                <input type="number" id="xp-${doc.id}" value="${xp}" min="-2" max="10"
                  style="width:55px;background:rgba(255,255,255,0.08);border:1px solid var(--border);
                         border-radius:6px;padding:4px 6px;color:var(--text);font-size:13px;text-align:center;">
                <button onclick="applyXP('${doc.id}','${d.authorId}',${d.isTemp||false})"
                  style="background:rgba(99,179,237,0.15);border:1px solid rgba(99,179,237,0.3);
                         border-radius:6px;padding:4px 10px;color:var(--primary);font-size:12px;cursor:pointer;font-family:inherit;">
                  적용
                </button>
              </div>
              <!-- 삭제 -->
              <button onclick="adminDeletePost('${doc.id}','${d.authorId}',${d.isTemp||false},${xp})"
                style="background:rgba(252,129,129,0.15);border:1px solid rgba(252,129,129,0.3);
                       border-radius:6px;padding:4px 10px;color:var(--red);font-size:12px;cursor:pointer;font-family:inherit;">
                🗑️ 삭제
              </button>
            </div>
          </div>
          <p style="font-size:13px;color:var(--text);line-height:1.6;margin:0;white-space:pre-wrap;">${d.content}</p>
          ${d.link?`<a href="${d.link}" target="_blank" style="font-size:12px;color:var(--primary);margin-top:6px;display:inline-block;">🔗 ${d.link}</a>`:''}
          <div style="margin-top:8px;">
            <span style="background:rgba(246,173,85,0.15);border:1px solid rgba(246,173,85,0.3);border-radius:6px;padding:2px 8px;font-size:11px;color:var(--accent);" id="xp-badge-${doc.id}">현재 +${xp}점</span>
          </div>
        </div>`;
    }).join('');
  } catch(e) {
    list.innerHTML = `<div style="color:var(--red);padding:16px;">오류: ${e.message}</div>`;
  }
}

async function applyXP(docId, authorId, isTemp){
  const input = document.getElementById('xp-'+docId);
  const newXp = parseInt(input.value);
  if (isNaN(newXp)||newXp<-2||newXp>10) { alert('-2 ~ 10 범위로 입력해주세요.'); return; }
  try {
    const snap = await db.collection(currentBoardCollection).doc(docId).get();
    if (!snap.exists) { alert('게시글을 찾을 수 없습니다.'); return; }
    const post = snap.data();
    const oldXp = post.xp || BOARD_DEFAULT_XP;
    const diff = newXp - oldXp;
    await db.collection(currentBoardCollection).doc(docId).update({ xp: newXp });
    // 회원이면 점수 조정
    if (!isTemp && authorId && diff !== 0) {
      await addScore(authorId, diff, `관리자 게시글 점수 조정 (${currentBoardCollection})`);
    }
    document.getElementById('xp-badge-'+docId).textContent = `현재 +${newXp}점`;
    alert(`✅ 점수가 ${newXp}점으로 변경되었습니다.${!isTemp&&diff!==0?` (${diff>0?'+':''}${diff}점 반영)`:''}`);
  } catch(e) { alert('오류: '+e.message); }
}

async function adminDeletePost(docId, authorId, isTemp, xp){
  if (!confirm('이 게시글을 삭제할까요?\n작성자의 점수가 회수됩니다.')) return;
  try {
    await db.collection(currentBoardCollection).doc(docId).delete();
    // 회원이면 점수 회수
    if (!isTemp && authorId) {
      await addScore(authorId, -(xp||BOARD_DEFAULT_XP), `관리자 게시글 삭제 (${currentBoardCollection})`);
    }
    document.getElementById('apost-'+docId)?.remove();
    alert('✅ 삭제되었습니다.');
  } catch(e) { alert('삭제 실패: '+e.message); }
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
}

function logout() {
  sessionStorage.removeItem('gameUser');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
