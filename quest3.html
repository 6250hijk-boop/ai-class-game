<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>퀘스트 3: 인공지능 수업자료 만들기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;overflow:hidden;user-select:none;font-family:'Noto Sans KR',sans-serif;}
    .game-screen{position:fixed;inset:0;background:#000;}
    .game-bg{position:absolute;inset:0;background:url('images/bgq3-1.png') center/cover no-repeat;}
    .game-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,0.82) 100%);}
    .ai-notice{position:absolute;top:52px;left:12px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.6);z-index:25;backdrop-filter:blur(4px);}

    /* 내 캐릭터 왼쪽, 선생님 캐릭터 오른쪽 */
    .my-char{
      position:absolute;bottom:clamp(155px,21vw,210px);left:3%;
      height:clamp(110px,33vh,320px);object-fit:contain;
      filter:drop-shadow(4px 4px 10px rgba(0,0,0,0.9)) brightness(0.85);
      animation:myFloat 3s ease-in-out infinite .5s;z-index:10;
    }
    .speaker-char{
      position:absolute;bottom:clamp(155px,21vw,210px);right:3%;
      height:clamp(110px,33vh,320px);object-fit:contain;
      filter:drop-shadow(-4px 4px 10px rgba(0,0,0,0.9)) scaleX(-1);
      animation:charFloat 3s ease-in-out infinite;z-index:10;
      transform:scaleX(-1); /* 좌우반전 */
    }
    @keyframes charFloat{0%,100%{transform:scaleX(-1) translateY(0);}50%{transform:scaleX(-1) translateY(-8px);}}
    @keyframes myFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

    /* HUD */
    .game-hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);z-index:20;}
    .hud-back{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:7px;padding:5px 10px;color:white;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;}
    .hud-title{font-family:'Jua',sans-serif;font-size:clamp(11px,2.2vw,14px);color:white;text-shadow:0 2px 4px rgba(0,0,0,0.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hud-right{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}
    .hud-score{background:rgba(167,139,250,0.25);border:1px solid rgba(167,139,250,0.4);border-radius:20px;padding:4px 10px;font-size:12px;color:#a78bfa;font-weight:700;}
    .hud-progress{background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.7);}

    /* 대화창 */
    .dialog-box{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 clamp(8px,3vw,20px) clamp(10px,2vh,16px);}
    .dialog-top-bar{display:flex;align-items:center;gap:8px;}
    .char-name-tag{display:inline-block;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white;font-weight:700;font-family:'Jua',sans-serif;padding:5px 16px;border-radius:10px 10px 0 0;font-size:clamp(12px,3vw,15px);box-shadow:0 -2px 10px rgba(167,139,250,0.3);}
    .btn-prev{margin-left:auto;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:4px 10px;color:rgba(255,255,255,0.7);font-size:12px;cursor:pointer;font-family:inherit;display:none;align-items:center;}
    .dialog-text-box{background:rgba(10,14,26,0.94);border:2px solid rgba(167,139,250,0.4);border-radius:0 12px 12px 12px;padding:clamp(14px,2.5vw,20px) clamp(40px,6vw,55px) clamp(14px,2.5vw,20px) clamp(14px,2.5vw,22px);position:relative;min-height:clamp(90px,13vh,125px);max-height:clamp(150px,26vh,220px);overflow-y:auto;backdrop-filter:blur(10px);box-shadow:0 -4px 30px rgba(0,0,0,0.5);}
    .dialog-text{font-size:clamp(14px,2.4vw,17px);line-height:1.85;color:#e2e8f0;white-space:pre-line;}
    .dialog-next{position:absolute;bottom:12px;right:12px;width:26px;height:26px;background:rgba(167,139,250,0.2);border:2px solid rgba(167,139,250,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:arrowBounce 1s ease-in-out infinite;}
    .dialog-next::after{content:'▼';font-size:10px;color:#a78bfa;}
    @keyframes arrowBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}

    /* 빔프로젝터 이미지 */
    .study-img-overlay{
      position:absolute;
      top:50%;left:50%;
      transform:translate(-50%,-58%);
      z-index:15;
      max-width:clamp(200px,45vw,520px);
      max-height:clamp(120px,30vh,320px);
      width:auto;height:auto;
      border-radius:10px;
      box-shadow:0 0 40px rgba(0,0,0,0.8), 0 0 0 3px rgba(255,255,255,0.15);
      animation:projectorIn .5s ease;
      object-fit:contain;
    }
    @keyframes projectorIn{from{opacity:0;transform:translate(-50%,-55%) scale(0.92);}to{opacity:1;transform:translate(-50%,-58%) scale(1);}}

    /* 퀴즈 오버레이 */
    .quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);}
    .quiz-box{background:#111827;border:1px solid rgba(167,139,250,0.3);border-radius:20px;width:100%;max-width:600px;padding:clamp(18px,3vw,28px);animation:slideUp .4s ease;box-shadow:0 0 80px rgba(167,139,250,0.15);max-height:92vh;overflow-y:auto;}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
    .quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .quiz-header h2{font-family:'Jua',sans-serif;font-size:clamp(16px,3vw,20px);color:#a78bfa;}
    .quiz-step{font-size:12px;color:rgba(255,255,255,0.4);margin-left:auto;}

    /* 카드 뒤집기 */
    .card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.5vw,12px);margin-top:14px;}
    .card-wrap{perspective:600px;height:clamp(70px,12vw,100px);cursor:pointer;}
    .card-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s ease;border-radius:10px;}
    .card-wrap.flipped .card-inner{transform:rotateY(180deg);}
    .card-wrap.matched .card-inner{transform:rotateY(180deg);}
    .card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;font-size:clamp(11px,1.8vw,13px);line-height:1.4;text-align:center;}
    .card-back{background:linear-gradient(135deg,#2d1b69,#4c1d95);border:2px solid rgba(167,139,250,0.4);color:#a78bfa;font-size:clamp(18px,3vw,24px);}
    .card-front{background:rgba(255,255,255,0.06);border:2px solid rgba(167,139,250,0.3);color:#e2e8f0;transform:rotateY(180deg);}
    .card-wrap.matched .card-front{background:rgba(104,211,145,0.15);border-color:#68d391;color:#68d391;}
    .card-wrap.wrong-flash .card-inner{animation:wrongFlash .4s ease;}
    @keyframes wrongFlash{0%,100%{transform:rotateY(180deg);}50%{transform:rotateY(180deg) scale(0.95);border-color:#fc8181;}}

    .quiz-check-btn{width:100%;padding:12px;margin-top:14px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:11px;color:white;font-size:clamp(13px,2.5vw,15px);font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;}
    .quiz-check-btn:hover{transform:translateY(-2px);}
    .quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:9px;font-size:clamp(12px,2vw,13px);line-height:1.5;}
    .quiz-feedback.correct{background:rgba(104,211,145,0.15);border:1px solid #68d391;color:#68d391;}
    .quiz-feedback.wrong{background:rgba(252,129,129,0.15);border:1px solid #fc8181;color:#fc8181;}
    .quiz-result{text-align:center;padding:16px 0;}
    .quiz-result .big-emoji{font-size:clamp(48px,8vw,64px);margin-bottom:12px;}
    .xp-gain{color:#f6ad55;font-size:clamp(16px,3vw,20px);margin-bottom:16px;}

    .levelup-screen{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
    .levelup-screen h1{font-family:'Jua',sans-serif;font-size:clamp(32px,6vw,48px);color:#f6ad55;}
    .xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#a78bfa,#f6ad55);color:#0a0e1a;font-weight:700;font-size:clamp(18px,4vw,24px);padding:14px 36px;border-radius:18px;z-index:500;animation:popIn .4s ease,fadeOutUp .5s ease 1.5s forwards;pointer-events:none;}
    @keyframes popIn{from{transform:translate(-50%,-50%) scale(.5);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
    @keyframes fadeOutUp{to{opacity:0;transform:translate(-50%,-70%);}}
    @media(max-width:480px){.my-char,.speaker-char{height:clamp(90px,25vh,180px);}.card-grid{grid-template-columns:repeat(4,1fr);gap:5px;}}
  </style>
</head>
<body>

<!-- 퀴즈 팝업 -->
<div id="quiz-overlay" class="quiz-overlay" style="display:none;">
  <div class="quiz-box">
    <div class="quiz-header">
      <h2 id="quiz-title">🃏 카드 매칭 퀴즈!</h2>
      <span id="quiz-step" class="quiz-step"></span>
    </div>
    <div id="quiz-content"></div>
  </div>
</div>

<div class="game-screen">
  <div class="game-bg" id="game-bg"></div>
  <div class="ai-notice">본 프로그램의 배경화면과 캐릭터는 AI로 생성되었습니다.</div>

  <!-- 내 캐릭터 (왼쪽) -->
  <img class="my-char" id="my-char" src="images/robot_1.png" alt="내캐릭터">
  <!-- AI 튜터 캐릭터 (오른쪽, 좌우반전) -->
  <img class="speaker-char" id="speaker-char" src="images/char4.png" alt="AI튜터">

  <!-- 빔프로젝터 이미지 (숨김) -->
  <img id="study-img" class="study-img-overlay" style="display:none;" alt="학습자료">

  <div class="game-hud">
    <a href="main.html" class="hud-back">← 메인</a>
    <div class="hud-title">📚 퀘스트 3: 인공지능 수업자료 만들기</div>
    <div class="hud-right">
      <div class="hud-progress" id="hud-progress">1 / 1</div>
      <div class="hud-score" id="hud-score">0 점</div>
    </div>
  </div>

  <div class="dialog-box">
    <div class="dialog-top-bar">
      <div class="char-name-tag">AI 튜터</div>
      <button class="btn-prev" id="btn-prev" onclick="prevMessage()">◀ 이전</button>
    </div>
    <div class="dialog-text-box">
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-next" id="dialog-next" onclick="nextMessage()"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// type: 'img' = 빔프로젝터 이미지 표시, 'quiz' = 퀴즈 트리거
const MESSAGES = [
  { text:"안녕하세요. AI튜터입니다. 😊\n이번 과정은 지도학습을 위한\n데이터를 수집하는 방법을 알려드리겠습니다." },
  { text:"AI를 똑똑하게 학습시키려면\n먼저 좋은 데이터가 있어야 합니다.\n마치 교과서를 만들기 위해\n자료를 수집하는 것과 같습니다." },
  { text:"AI를 공부시킬 교과서를 만들려면\n교과서에 들어갈 수업자료들을 만들어야겠죠?" },
  { text:"만약 컴퓨터공학과 가려는 학생을 위해\n세계사 수업자료를 준비해서 주면 도움이 될까요?" },
  { text:"물론 역사공부는 되겠지만\n컴퓨터공학과에 가기 위한 공부는 아니겠지요." },
  { text:"인공지능도 마찬가지입니다.\n의미없는 자료를 학습시키면\n좋은 인공지능이 될 수 없어요." },
  { text:"그럼 어떤 자료가 좋은 자료일까요? 🤔" },
  { text:"일단 이미지 데이터를 수집한다고 가정하고\n이미지 데이터 위주로 설명하겠습니다." },

  // study3-1 이미지 표시
  { text:"첫째, 선명하고 초점이 잘 맞아야 합니다. 📷", type:"img", img:"study3-1" },
  { text:"이미지는 수십만개의 작은 점(픽셀)들로\n이루어져 있습니다." },
  { text:"인공지능은 픽셀의 경계로 특징을 찾아내기 때문에\n초점이 흐린 사진은 경계를 찾기 어려워집니다." },

  // study3-2 이미지 표시
  { text:"둘째, 내가 학습시키려는 사진이\n가려져 있으면 안됩니다. 🚫", type:"img", img:"study3-2" },
  { text:"사람은 정답을 유추할 수 있지만\n아직 인공지능은 배우는 단계이기 때문에\n가려져 있으면 안됩니다." },
  { text:"쓰레기통 뒤에 있는 고양이를 많이 학습시키면\n쓰레기통도 고양이라고 인식할 수 있어요." },

  // study3-3 이미지 표시
  { text:"셋째, 다양한 사진으로 학습시켜야 합니다. 👥", type:"img", img:"study3-3" },
  { text:"사람의 사진을 모은다면\n다양한 모습의 사람을 학습시켜야 합니다." },
  { text:"나이, 성별, 키, 복장, 자세, 인종 등\n여러 모습의 사람을 학습시켜야\n어떤 사람이 찍히더라도 사람을 인식할 수 있습니다." },
  { text:"만약 교복입은 사람만 학습시켰다면\n교복입은 사람만 사람이라고 인식하고\n정장이나 군복을 입으면 인식을 못하게 됩니다." },

  // study3-4 이미지 표시
  { text:"넷째, 다양한 배경에서 찍은 사진이어야 합니다. 🌍", type:"img", img:"study3-4" },
  { text:"야외와 실내, 맑은 날과 흐린 날처럼\n바뀌는 주변 환경을 학습시켜줘야 합니다." },
  { text:"사과를 학습시키는데 책상 위에서만 학습시키면\n책상 위에 있는 사과만 인식할 수 있고,\n손에 들고 있거나 마트에 있는 사과는\n인식할 수 없어요." },
  { text:"우리가 AI에게 학습시킬 데이터를 수집할 때\n같은 데서만 여러 장 찍은 사진은\n아무리 많아도 의미가 없어요. ⚠️" },
  { text:"자, 지금까지 좋은 학습 데이터의 조건을\n배웠어요! 퀴즈로 확인해볼까요? 🃏", type:"quiz" },
];

// 카드 매칭 퀴즈 - 조건과 설명 매칭
const CARD_PAIRS = [
  { id:1, front:"선명한 초점", back:"픽셀 경계로 특징을 찾기 때문" },
  { id:2, front:"가림 없는 사진", back:"AI는 가려진 부분을 유추 못함" },
  { id:3, front:"다양한 사람 사진", back:"나이·성별·인종 등 모두 인식하려면" },
  { id:4, front:"다양한 배경", back:"실내·외, 날씨 변해도 인식하려면" },
];

let currentUser=null, userData=null;
let msgIdx=0, isTyping=false, typingTimer=null, quizShowing=false;
let currentStudyImg=null;

requireAuth(async (user) => {
  currentUser=user;
  if(user.uid==='student'){
    const local=JSON.parse(localStorage.getItem('tempUserData')||'null');
    userData=local||{charName:'AI',score:0,quests:{},name:'임시학생'};
  } else {
    const snap=await db.collection('users').where('id','==',user.id).get();
    if(!snap.empty){userData=snap.docs[0].data();currentUser.uid=snap.docs[0].id;}
  }
  updateHUD(); updateCharImages();
  document.getElementById('hud-progress').textContent='1 / '+MESSAGES.length;
  const quests=userData.quests||{};
  msgIdx=quests.q3_done?0:Math.min(quests.q3_msgIdx||0,MESSAGES.length-1);
  setTimeout(()=>showMessage(msgIdx),500);
});

function updateCharImages(){ document.getElementById('my-char').src=getLevelByScore(userData.score||0).img; }
function updateHUD(){
  document.getElementById('hud-score').textContent=(userData.score||0)+' 점';
}

function showMessage(idx){
  if(idx>=MESSAGES.length){showComplete();return;}
  const msg=MESSAGES[idx];
  document.getElementById('hud-progress').textContent=`${idx+1} / ${MESSAGES.length}`;
  document.getElementById('btn-prev').style.display=idx>0?'flex':'none';
  document.getElementById('dialog-next').style.display='flex';

  // 이미지 표시
  const imgEl=document.getElementById('study-img');
  if(msg.type==='img'){
    imgEl.src='images/'+msg.img+'.png';
    imgEl.style.display='block';
    currentStudyImg=msg.img;
  }
  // 이미지 없는 메시지면 현재 이미지 유지 (다음 img 메시지 전까지)

  typeText(document.getElementById('dialog-text'), msg.text, ()=>{
    if(msg.type==='quiz'){
      document.getElementById('dialog-next').style.display='none';
      quizShowing=true;
      setTimeout(()=>startQuiz(),600);
    }
  });
}

function typeText(el,text,cb){
  el.textContent=''; isTyping=true;
  document.getElementById('dialog-next').style.opacity='0.3';
  let i=0;
  typingTimer=setInterval(()=>{
    if(i<text.length){el.textContent=text.slice(0,i+1);i++;}
    else{clearInterval(typingTimer);el.textContent=text;isTyping=false;document.getElementById('dialog-next').style.opacity='1';if(cb)cb();}
  },22);
}

function nextMessage(){
  if(quizShowing) return;
  if(isTyping){
    clearInterval(typingTimer);
    const msg=MESSAGES[msgIdx];
    document.getElementById('dialog-text').textContent=msg.text;
    isTyping=false;
    document.getElementById('dialog-next').style.opacity='1';
    if(msg.type==='img'){
      document.getElementById('study-img').src='images/'+msg.img+'.png';
      document.getElementById('study-img').style.display='block';
    }
    if(msg.type==='quiz'){document.getElementById('dialog-next').style.display='none';quizShowing=true;setTimeout(()=>startQuiz(),400);}
    return;
  }
  msgIdx++; autoSave(); showMessage(msgIdx);
}
function prevMessage(){
  if(quizShowing) return;
  if(isTyping){clearInterval(typingTimer);isTyping=false;}
  if(msgIdx>0){msgIdx--;showMessage(msgIdx);}
}
async function autoSave(){
  if(currentUser.uid==='student'){
    userData.quests=userData.quests||{};userData.quests.q3_msgIdx=msgIdx;
    localStorage.setItem('tempUserData',JSON.stringify(userData));return;
  }
  await db.collection('users').doc(currentUser.uid).update({'quests.q3_msgIdx':msgIdx});
}

document.addEventListener('click',(e)=>{
  if(quizShowing) return;
  if(e.target.closest('.dialog-next')||e.target.closest('.hud-back')||e.target.closest('.btn-prev')) return;
  nextMessage();
});
document.addEventListener('keydown',(e)=>{
  if(quizShowing) return;
  if(e.code==='Space'||e.code==='Enter') nextMessage();
  if(e.code==='ArrowLeft') prevMessage();
});

// ══ 카드 뒤집기 매칭 퀴즈 ══
let flipped=[], matched=0, canFlip=true, totalScore=0;

function startQuiz(){
  // 카드 섞기
  const cards=[];
  CARD_PAIRS.forEach(p=>{
    cards.push({id:p.id, type:'front', text:p.front});
    cards.push({id:p.id, type:'back',  text:p.back});
  });
  cards.sort(()=>Math.random()-.5);

  document.getElementById('quiz-overlay').style.display='flex';
  document.getElementById('quiz-title').textContent='🃏 카드 매칭 퀴즈!';
  document.getElementById('quiz-step').textContent='조건과 이유를 매칭하세요!';
  document.getElementById('quiz-content').innerHTML=`
    <p style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:14px;line-height:1.6;">
      카드를 뒤집어서 조건과 그 이유를 짝지어보세요!<br>
      <span style="color:#a78bfa;">보라색 카드</span>: 조건 &nbsp;|&nbsp; <span style="color:#e2e8f0;">흰색 카드</span>: 이유
    </p>
    <div class="card-grid" id="card-grid">
      ${cards.map((c,i)=>`
        <div class="card-wrap" id="card-${i}" data-id="${c.id}" data-type="${c.type}" data-idx="${i}" onclick="flipCard(${i})">
          <div class="card-inner">
            <div class="card-face card-back">🃏</div>
            <div class="card-face card-front">${c.text}</div>
          </div>
        </div>`).join('')}
    </div>
    <div id="quiz-feedback" style="margin-top:12px;"></div>`;
  flipped=[]; matched=0; canFlip=true; totalScore=0;
}

function flipCard(idx){
  if(!canFlip) return;
  const card=document.getElementById('card-'+idx);
  if(!card||card.classList.contains('flipped')||card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flipped.push(idx);
  if(flipped.length===2) checkMatch();
}

function checkMatch(){
  canFlip=false;
  const [i1,i2]=flipped;
  const c1=document.getElementById('card-'+i1);
  const c2=document.getElementById('card-'+i2);
  const id1=c1.dataset.id, id2=c2.dataset.id;
  const type1=c1.dataset.type, type2=c2.dataset.type;

  if(id1===id2&&type1!==type2){
    // 매칭 성공
    setTimeout(()=>{
      c1.classList.add('matched'); c2.classList.add('matched');
      matched++;
      totalScore+=10;
      document.getElementById('quiz-feedback').innerHTML=
        `<div class="quiz-feedback correct">🎉 매칭 성공! +10점 (${matched}/${CARD_PAIRS.length}쌍 완료)</div>`;
      if(matched===CARD_PAIRS.length) setTimeout(finishQuiz,800);
      flipped=[]; canFlip=true;
    },500);
  } else {
    // 매칭 실패
    setTimeout(()=>{
      c1.classList.add('wrong-flash'); c2.classList.add('wrong-flash');
      document.getElementById('quiz-feedback').innerHTML=
        `<div class="quiz-feedback wrong">❌ 다시 시도해보세요!</div>`;
      setTimeout(()=>{
        c1.classList.remove('flipped','wrong-flash');
        c2.classList.remove('flipped','wrong-flash');
        flipped=[]; canFlip=true;
      },800);
    },500);
  }
}

async function finishQuiz(){
  const xp=totalScore+(matched===CARD_PAIRS.length?10:0);
  if(currentUser.uid==='student'){
    userData.score=(userData.score||0)+xp;
    userData.quests=userData.quests||{};
    userData.quests.q3_done=true;
    localStorage.setItem('tempUserData',JSON.stringify(userData));
    updateHUD(); updateCharImages();
  } else {
    await addScore(currentUser.uid,xp,'퀘스트3 퀴즈');
    await db.collection('users').doc(currentUser.uid).update({'quests.q3_done':true});
    await db.collection('quiz_results').doc(currentUser.uid).set({
      q3:firebase.firestore.FieldValue.arrayUnion({score:matched,total:CARD_PAIRS.length,xp,date:new Date().toISOString()})
    },{merge:true});
    userData.score=(userData.score||0)+xp;
    updateHUD(); updateCharImages();
    checkLevelUp(userData.score-xp,userData.score);
  }
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-result">
      <div class="big-emoji">${matched===CARD_PAIRS.length?'🏆':'👍'}</div>
      <h3>모든 카드 매칭 완료! 🎉</h3>
      <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;">${CARD_PAIRS.length}쌍 모두 완성!</div>
      <div class="xp-gain">+${xp} 점 획득!</div>
      <button class="quiz-check-btn" onclick="closeQuiz()">계속하기 →</button>
    </div>`;
  showXPPopup('+'+xp+' 점');
}

function closeQuiz(){
  quizShowing=false;
  document.getElementById('quiz-overlay').style.display='none';
  document.getElementById('study-img').style.display='none';
  showComplete();
}

function checkLevelUp(before,after){
  const lvB=getLevelByScore(before),lvA=getLevelByScore(after);
  if(lvA.level>lvB.level){
    const el=document.createElement('div');
    el.className='levelup-screen';
    el.innerHTML=`<img src="${lvA.img}" style="height:130px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(246,173,85,0.8));">
      <h1>레벨 업! 🎉</h1><p>Lv.${lvA.level} ${lvA.name}</p>
      <button class="quiz-check-btn" style="max-width:200px;margin-top:14px;" onclick="this.parentElement.remove()">확인</button>`;
    document.body.appendChild(el);
  }
}

let completeShown=false;
function showComplete(){
  if(completeShown) return;
  completeShown=true;
  const overlay=document.createElement('div');
  overlay.id='complete-overlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:150;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;';
  overlay.innerHTML=`
    <div style="background:#111827;border:2px solid rgba(167,139,250,0.4);border-radius:24px;
         padding:36px 32px;text-align:center;max-width:360px;width:90%;
         box-shadow:0 0 60px rgba(167,139,250,0.2);animation:slideUp .4s ease;">
      <div style="font-size:56px;margin-bottom:12px;">🏅</div>
      <h2 style="font-family:'Jua',sans-serif;font-size:22px;color:#a78bfa;margin-bottom:6px;">퀘스트 3 완료!</h2>
      <p style="font-size:14px;color:rgba(255,255,255,0.6);margin-bottom:24px;line-height:1.6;">
        좋은 학습 데이터의 조건을<br>성공적으로 배웠어요! 📸
      </p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button onclick="window.location.href='quest4.html'"
          style="padding:14px;background:linear-gradient(135deg,#a78bfa,#7c3aed);border:none;border-radius:12px;color:white;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;">
          다음 퀘스트 → 인공지능 공부시키기 🎓
        </button>
        <button onclick="replayQuest()"
          style="padding:12px;background:rgba(246,173,85,0.15);border:1px solid rgba(246,173,85,0.4);border-radius:12px;color:#f6ad55;font-size:14px;cursor:pointer;font-family:inherit;">
          🔄 다시 하기
        </button>
        <button onclick="goMain()"
          style="padding:12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:12px;color:rgba(255,255,255,0.7);font-size:14px;cursor:pointer;font-family:inherit;">
          🏠 메인으로 돌아가기
        </button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function replayQuest(){
  if(currentUser.uid==='student'){
    userData.quests=userData.quests||{};
    userData.quests.q3_msgIdx=0; userData.quests.q3_done=false;
    localStorage.setItem('tempUserData',JSON.stringify(userData));
  } else {
    db.collection('users').doc(currentUser.uid).update({'quests.q3_msgIdx':0,'quests.q3_done':false});
  }
  window.location.reload();
}
function goMain(){ sessionStorage.setItem('from_quest','1'); window.location.href='main.html'; }
</script>
