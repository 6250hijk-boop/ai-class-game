<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
  <title>퀘스트 8: AI로 영상 분석하기</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);min-height:100vh;}
    .page-wrap{max-width:800px;margin:0 auto;padding:clamp(16px,3vw,28px);}
    .page-title{font-family:'Jua',sans-serif;font-size:clamp(20px,4vw,26px);color:#a78bfa;margin-bottom:6px;}
    .page-desc{font-size:clamp(13px,2.3vw,14px);color:var(--muted);margin-bottom:20px;line-height:1.6;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(16px,3vw,24px);margin-bottom:16px;}
    .card h3{font-size:clamp(15px,2.8vw,17px);margin-bottom:12px;display:flex;align-items:center;gap:8px;margin-top:0;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:clamp(10px,2vw,13px) clamp(14px,3vw,22px);border:none;border-radius:11px;font-size:clamp(13px,2.5vw,15px);font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;text-decoration:none;}
    .btn-primary{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:white;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(167,139,250,0.4);}
    .btn-ghost{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--text);}
    .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;}
    .info-box{background:rgba(104,211,145,0.08);border:1px solid rgba(104,211,145,0.2);border-radius:10px;padding:12px 14px;font-size:13px;color:rgba(104,211,145,0.9);margin:10px 0;line-height:1.6;}
    .warn-box{background:rgba(246,173,85,0.08);border:1px solid rgba(246,173,85,0.2);border-radius:10px;padding:12px 14px;font-size:13px;color:rgba(246,173,85,0.9);margin:10px 0;line-height:1.6;}
    .tip-box{background:rgba(99,179,237,0.08);border:1px solid rgba(99,179,237,0.2);border-radius:10px;padding:12px 14px;font-size:13px;color:rgba(99,179,237,0.9);margin:10px 0;line-height:1.6;}

    /* 업로드 영역 */
    .upload-zone{border:2px dashed rgba(167,139,250,0.4);border-radius:16px;padding:clamp(24px,5vw,40px) 20px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(167,139,250,0.04);margin-bottom:16px;}
    .upload-zone:hover,.upload-zone.dragover{border-color:#a78bfa;background:rgba(167,139,250,0.1);}
    .upload-zone .icon{font-size:clamp(32px,7vw,48px);margin-bottom:10px;}
    .upload-zone h3{font-size:clamp(14px,3vw,17px);margin-bottom:4px;color:var(--text);}
    .upload-zone p{font-size:clamp(11px,2.2vw,13px);color:var(--muted);margin:0;}
    #file-input{display:none;}

    /* 예시 사진 */
    .sample-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(90px,18vw,130px),1fr));gap:8px;margin:12px 0;}
    .sample-item{border-radius:10px;overflow:hidden;border:2px solid var(--border);aspect-ratio:1;cursor:pointer;transition:all .2s;position:relative;}
    .sample-item:hover{border-color:#a78bfa;transform:scale(1.03);}
    .sample-item.selected{border-color:#a78bfa;box-shadow:0 0 12px rgba(167,139,250,0.5);}
    .sample-item img{width:100%;height:100%;object-fit:cover;display:block;}
    .sample-item .lbl{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.7);color:white;font-size:10px;padding:3px;text-align:center;}

    /* 결과 영역 */
    .result-wrap{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:12px;}
    .result-wrap canvas{width:100%;display:block;}
    .result-wrap img{width:100%;display:block;border-radius:12px;}

    /* 감지 결과 */
    .detection-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
    .detection-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.03);}
    .detection-icon{font-size:20px;flex-shrink:0;}
    .detection-name{flex:1;font-weight:700;font-size:14px;}
    .detection-conf{font-size:13px;color:var(--muted);}
    .conf-bar-wrap{flex:1;background:rgba(255,255,255,0.08);border-radius:20px;height:6px;overflow:hidden;}
    .conf-bar{height:100%;border-radius:20px;}

    /* 통계 */
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px;}
    .stat-box{text-align:center;padding:12px;border-radius:12px;border:1px solid var(--border);}
    .stat-num{font-family:'Jua',sans-serif;font-size:clamp(22px,5vw,32px);}
    .stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;}

    /* 클래스 뱃지 */
    .class-badges{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
    .class-badge{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;}

    /* 로딩 */
    .loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
    .loading-overlay.show{display:flex;}
    .spinner{width:48px;height:48px;border:4px solid rgba(167,139,250,0.2);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    @media(max-width:480px){.page-wrap{padding:12px;}.stats-grid{grid-template-columns:repeat(3,1fr);gap:6px;}}
  </style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <div style="color:white;font-size:15px;font-weight:700;" id="loading-msg">AI 분석 중...</div>
</div>

<div class="page-wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <a href="quest7.html" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;text-decoration:none;">← 라벨링</a>
    <a href="main.html" onclick="sessionStorage.setItem('from_quest','1')" style="background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:13px;text-decoration:none;">🏠 메인</a>
    <div id="hud-score" style="background:rgba(167,139,250,0.2);border:1px solid rgba(167,139,250,0.3);border-radius:20px;padding:4px 12px;font-size:13px;color:#a78bfa;font-weight:700;margin-left:auto;">0 점</div>
  </div>

  <div class="page-title">🎯 퀘스트 8: AI로 영상 분석하기</div>
  <div class="page-desc">AI가 사진에서 킥보드 🛴, 헬멧 ⛑️, 사람 🧍을 찾아드려요!</div>

  <!-- 모델 소개 -->
  <div class="card">
    <h3>🤖 AI 모델 소개</h3>
    <div class="class-badges">
      <span class="class-badge" style="background:rgba(252,129,129,0.15);border:1px solid #fc8181;color:#fc8181;">🛴 킥보드</span>
      <span class="class-badge" style="background:rgba(99,179,237,0.15);border:1px solid #63b3ed;color:#63b3ed;">⛑️ 헬멧</span>
      <span class="class-badge" style="background:rgba(104,211,145,0.15);border:1px solid #68d391;color:#68d391;">🧍 사람</span>
    </div>
    <div class="info-box">
      ✅ <strong>YOLOv8 기반 모델 (pm-hpp v5)</strong><br>
      킥보드 이용자의 안전모 착용 여부를 자동으로 감지해요!
    </div>
  </div>

  <!-- 예시 사진 -->
  <div class="card">
    <h3>🖼️ 예시 사진으로 테스트</h3>
    <div class="tip-box">💡 아래 예시 사진을 클릭하면 AI가 바로 분석해줘요!</div>
    <div class="sample-grid" id="sample-grid">
      <!-- JS로 생성 -->
    </div>
  </div>

  <!-- 내 사진 업로드 -->
  <div class="card">
    <h3>📸 내 사진 업로드해서 분석</h3>
    <div class="upload-zone" id="upload-zone"
      onclick="document.getElementById('file-input').click()"
      ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFile(event)">
      <div class="icon">📤</div>
      <h3>사진을 여기에 드래그하거나 클릭</h3>
      <p>JPG, PNG 지원 · 클릭하면 바로 AI 분석!</p>
    </div>
    <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
  </div>

  <!-- 결과 -->
  <div class="card" id="result-card" style="display:none;">
    <h3>📊 분석 결과</h3>
    <div class="result-wrap">
      <canvas id="result-canvas"></canvas>
    </div>

    <!-- 감지 목록 -->
    <div class="detection-list" id="detection-list"></div>

    <!-- 통계 -->
    <div class="stats-grid" id="stats-grid"></div>

    <!-- 안전 판단 -->
    <div id="safety-result" style="margin-top:12px;"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// Roboflow 설정
const RF = {
  API_KEY:   'uAmKBn82eijLr9pmxLGt',
  WORKSPACE: 'jihyung-kim',
  PROJECT:   'pm-hpp',
  VERSION:   '5',
};

// 클래스 색상/이모지
const CLASS_INFO = {
  default: { emoji:'🔲', color:'#a78bfa' },
};
function getClassInfo(name) {
  const n = (name||'').toLowerCase();
  if(n.includes('kick')||n.includes('pm')||n.includes('킥')||n.includes('scooter'))
    return {emoji:'🛴', color:'#fc8181'};
  if(n.includes('helmet')||n.includes('헬멧')||n.includes('hat'))
    return {emoji:'⛑️', color:'#63b3ed'};
  if(n.includes('person')||n.includes('사람')||n.includes('human')||n.includes('rider'))
    return {emoji:'🧍', color:'#68d391'};
  return {emoji:'🔲', color:'#a78bfa'};
}

// 예시 사진 목록
const SAMPLES = [
  {url:'images/pm1.jpg', label:'예시 1'},
  {url:'images/pm2.jpg', label:'예시 2'},
  {url:'images/pm3.jpg', label:'예시 3'},
];

let currentUser=null, userData=null;

requireAuth(async (user)=>{
  currentUser=user;
  if(user.uid==='student'){
    const local=JSON.parse(localStorage.getItem('tempUserData')||'null');
    userData=local||{score:0};
  } else {
    const snap=await db.collection('users').where('id','==',user.id).get();
    if(!snap.empty) userData=snap.docs[0].data();
  }
  document.getElementById('hud-score').textContent=(userData.score||0)+' 점';
  renderSamples();
});

function renderSamples(){
  document.getElementById('sample-grid').innerHTML=SAMPLES.map((s,i)=>`
    <div class="sample-item" onclick="analyzeSampleImage('${s.url}')">
      <img src="${s.url}" alt="${s.label}"
        onerror="this.parentElement.style.background='rgba(167,139,250,0.1)';this.style.display='none'">
      <div class="lbl">${s.label}</div>
    </div>`).join('');
}

// 드래그앤드롭
function dragOver(e){e.preventDefault();document.getElementById('upload-zone').classList.add('dragover');}
function dragLeave(e){document.getElementById('upload-zone').classList.remove('dragover');}
function dropFile(e){
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file&&file.type.startsWith('image/')) handleFile(file);
}

// 파일 → base64
function fileToBase64(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

// URL → base64
async function urlToBase64(url){
  const res=await fetch(url);
  const blob=await res.blob();
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result.split(',')[1]);
    reader.readAsDataURL(blob);
  });
}

// 파일 핸들링
async function handleFile(file){
  showLoading('이미지 준비 중...');
  try{
    const base64=await fileToBase64(file);
    const imgUrl=URL.createObjectURL(file);
    await analyzeImage(base64, imgUrl, file); // 파일 전달
  }catch(e){
    alert('분석 실패: '+e.message);
  }finally{hideLoading();}
}

// 예시 사진 분석
async function analyzeSampleImage(url){
  showLoading('예시 사진 분석 중...');
  try{
    const base64=await urlToBase64(url);
    await analyzeImage(base64, url, null); // null = 예시사진 (URL 직접 사용)
  }catch(e){
    alert('분석 실패: '+e.message);
  }finally{hideLoading();}
}

// Cloudinary 설정 (quest6와 동일)
const CLOUDINARY = {
  CLOUD_NAME: 'dbthgzdfu',
  UPLOAD_PRESET: 'vxhz699w',
};

// 파일 → Cloudinary 업로드 → URL 반환
async function uploadToCloudinary(file){
  const form=new FormData();
  form.append('file', file);
  form.append('upload_preset', CLOUDINARY.UPLOAD_PRESET);
  form.append('folder', 'ai-class-test');
  const res=await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY.CLOUD_NAME}/image/upload`,
    {method:'POST', body:form}
  );
  if(!res.ok) throw new Error('이미지 업로드 실패');
  const data=await res.json();
  return data.secure_url;
}

// base64 → Blob → File
function base64ToFile(base64, fileName){
  const byteStr=atob(base64);
  const arr=new Uint8Array(byteStr.length);
  for(let i=0;i<byteStr.length;i++) arr[i]=byteStr.charCodeAt(i);
  return new File([arr], fileName, {type:'image/jpeg'});
}

// Roboflow API 호출 - URL 방식 (CORS 없음)
async function analyzeImage(base64, imgUrl, originalFile){
  showLoading('이미지 서버에 올리는 중...');

  let imageUrl;
  if(originalFile){
    // 파일 업로드한 경우 → Cloudinary에 올려서 URL 획득
    imageUrl=await uploadToCloudinary(originalFile);
  } else {
    // 예시 사진 → 절대 URL 사용
    imageUrl=new URL(imgUrl, window.location.href).href;
  }

  showLoading('AI 분석 중...');

  // Roboflow API - URL 방식
  const apiUrl=`https://serverless.roboflow.com/${RF.PROJECT}/${RF.VERSION}?api_key=${RF.API_KEY}&confidence=30&overlap=50&image=${encodeURIComponent(imageUrl)}`;
  const res=await fetch(apiUrl, {method:'POST'});

  if(!res.ok){
    const errText=await res.text();
    throw new Error('API 오류: '+res.status+' / '+errText);
  }
  const data=await res.json();
  await drawResults(imgUrl, data);
}

// 결과 그리기
async function drawResults(imgUrl, data){
  document.getElementById('result-card').style.display='block';
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});

  const canvas=document.getElementById('result-canvas');
  const ctx=canvas.getContext('2d');
  const img=new Image();
  img.crossOrigin='anonymous';

  await new Promise((resolve,reject)=>{
    img.onload=resolve; img.onerror=reject;
    img.src=imgUrl;
  });

  canvas.width=img.width; canvas.height=img.height;
  ctx.drawImage(img,0,0);

  const preds=data.predictions||[];

  // 바운딩박스 그리기
  preds.forEach(p=>{
    const info=getClassInfo(p.class);
    const x=p.x-p.width/2, y=p.y-p.height/2;
    const w=p.width, h=p.height;

    // 박스
    ctx.strokeStyle=info.color;
    ctx.lineWidth=Math.max(2, canvas.width/200);
    ctx.strokeRect(x,y,w,h);

    // 반투명 배경
    ctx.fillStyle=info.color+'33';
    ctx.fillRect(x,y,w,h);

    // 라벨 배경
    const fontSize=Math.max(12, canvas.width/50);
    ctx.font=`bold ${fontSize}px sans-serif`;
    const label=`${info.emoji} ${p.class} ${Math.round(p.confidence*100)}%`;
    const tw=ctx.measureText(label).width+10;
    ctx.fillStyle=info.color;
    ctx.fillRect(x,y-fontSize-6,tw,fontSize+8);

    // 라벨 텍스트
    ctx.fillStyle='white';
    ctx.fillText(label,x+5,y-4);
  });

  // 감지 목록
  const listEl=document.getElementById('detection-list');
  if(!preds.length){
    listEl.innerHTML=`<div style="text-align:center;padding:16px;color:var(--muted);">감지된 객체가 없어요</div>`;
  } else {
    listEl.innerHTML=preds.map(p=>{
      const info=getClassInfo(p.class);
      const conf=Math.round(p.confidence*100);
      return `<div class="detection-item">
        <div class="detection-icon">${info.emoji}</div>
        <div class="detection-name" style="color:${info.color};">${p.class}</div>
        <div class="conf-bar-wrap">
          <div class="conf-bar" style="width:${conf}%;background:${info.color};"></div>
        </div>
        <div class="detection-conf">${conf}%</div>
      </div>`;
    }).join('');
  }

  // 통계
  const counts={};
  preds.forEach(p=>{
    const info=getClassInfo(p.class);
    const key=p.class;
    if(!counts[key]) counts[key]={count:0,emoji:info.emoji,color:info.color};
    counts[key].count++;
  });
  document.getElementById('stats-grid').innerHTML=Object.entries(counts).map(([k,v])=>`
    <div class="stat-box" style="border-color:${v.color}20;background:${v.color}10;">
      <div class="stat-num" style="color:${v.color};">${v.count}</div>
      <div class="stat-lbl">${v.emoji} ${k}</div>
    </div>`).join('');

  // 안전 판단
  const classes=preds.map(p=>p.class.toLowerCase());
  const hasPerson=classes.some(c=>c.includes('person')||c.includes('사람')||c.includes('rider'));
  const hasKick=classes.some(c=>c.includes('kick')||c.includes('pm')||c.includes('scooter'));
  const hasHelmet=classes.some(c=>c.includes('helmet')||c.includes('헬멧'));
  const safeEl=document.getElementById('safety-result');

  if(hasPerson||hasKick){
    if(hasHelmet){
      safeEl.innerHTML=`<div class="info-box" style="font-size:15px;font-weight:700;">✅ 헬멧 착용이 감지되었습니다! 안전하게 이용 중이에요.</div>`;
    } else {
      safeEl.innerHTML=`<div class="warn-box" style="font-size:15px;font-weight:700;">⚠️ 헬멧 미착용이 의심됩니다! 안전을 위해 헬멧을 착용하세요.</div>`;
    }
  } else {
    safeEl.innerHTML=`<div class="tip-box">💡 킥보드나 사람이 감지되지 않았어요.</div>`;
  }
}

function showLoading(msg){
  document.getElementById('loading-msg').textContent=msg||'분석 중...';
  document.getElementById('loading').classList.add('show');
}
function hideLoading(){
  document.getElementById('loading').classList.remove('show');
}
</script>
</body>
</html>
