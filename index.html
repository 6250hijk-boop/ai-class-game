<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI 가디언 🤖</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <div style="font-size:52px;margin-bottom:8px;">🤖</div>
      <h1>AI 가디언</h1>
      <p>AI를 학습시키며 함께 성장하는 게임</p>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="showTab('login')">🔑 로그인</button>
      <button class="tab-btn" onclick="showTab('signup')">📝 회원가입</button>
      <button class="tab-btn" onclick="showTab('find')">🔍 찾기</button>
      <button class="tab-btn" onclick="showTab('temp')">⚡ 임시</button>
    </div>

    <!-- 로그인 -->
    <div id="tab-login">
      <div id="login-alert"></div>
      <div class="field"><label>아이디</label><input id="li-id" placeholder="아이디 입력"></div>
      <div class="field"><label>비밀번호</label><input id="li-pw" type="password" placeholder="비밀번호 입력"></div>
      <button class="btn btn-primary" onclick="doLogin()">로그인 →</button>
    </div>

    <!-- 회원가입 -->
    <div id="tab-signup" style="display:none;">
      <div id="signup-alert"></div>
      <div class="field"><label>아이디 (영문/숫자 4~20자)</label><input id="su-id" placeholder="아이디"></div>
      <div class="field"><label>이름</label><input id="su-name" placeholder="홍길동"></div>
      <div class="field"><label>학번</label><input id="su-stunum" placeholder="예: 10101"></div>
      <div class="field"><label>이메일</label><input id="su-email" type="email" placeholder="example@gmail.com"></div>
      <div class="field"><label>비밀번호 (6자 이상)</label><input id="su-pw" type="password" placeholder="비밀번호"></div>
      <div class="field"><label>비밀번호 확인</label><input id="su-pw2" type="password" placeholder="비밀번호 확인"></div>
      <button class="btn btn-primary" onclick="doSignup()">가입하기 →</button>
    </div>

    <!-- 찾기 -->
    <div id="tab-find" style="display:none;">
      <div id="find-alert"></div>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">
        가입 시 등록한 이메일로 아이디와 임시 비밀번호를 보내드려요.
      </p>
      <div class="field"><label>이메일</label><input id="find-email" type="email" placeholder="가입 이메일"></div>
      <button class="btn btn-primary" onclick="doFind()">찾기 →</button>
    </div>

    <!-- 임시 로그인 -->
    <div id="tab-temp" style="display:none;">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="alert alert-info">
          임시 계정으로 체험해볼 수 있어요.<br>진행상황은 저장되지 않습니다.
        </div>
        <button class="btn btn-accent" onclick="tempLogin('student')">
          🎓 임시 학생으로 입장
        </button>
        <button class="btn btn-ghost" onclick="tempLogin('admin')">
          👑 관리자로 입장
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// 이미 로그인 상태
const saved = sessionStorage.getItem('gameUser');
if (saved) {
  const u = JSON.parse(saved);
  window.location.href = u.isAdmin ? 'admin.html' : 'main.html';
}

function showTab(t) {
  ['login','signup','find','temp'].forEach(id => {
    document.getElementById('tab-'+id).style.display = id===t?'block':'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    b.classList.toggle('active', ['login','signup','find','temp'][i]===t);
  });
}

function alert2(id, msg, type='error') {
  document.getElementById(id).innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
}

async function doLogin() {
  const id = document.getElementById('li-id').value.trim();
  const pw = document.getElementById('li-pw').value;
  if (!id||!pw) return alert2('login-alert','아이디와 비밀번호를 입력하세요.');

  // 관리자
  if (id===ADMIN_ID && pw===ADMIN_PW) {
    sessionStorage.setItem('gameUser', JSON.stringify({uid:'admin',id:'admin',isAdmin:true,name:'관리자'}));
    window.location.href='admin.html'; return;
  }

  // 임시 학생
  if (id===STUDENT_ID && pw===STUDENT_PW) {
    sessionStorage.setItem('gameUser', JSON.stringify({uid:'student',id:'student',isAdmin:false,name:'임시학생',isTemp:true}));
    window.location.href='main.html'; return;
  }

  // 일반 유저
  try {
    const snap = await db.collection('users').where('id','==',id).get();
    if (snap.empty) return alert2('login-alert','❌ 아이디가 존재하지 않습니다.');
    const doc = snap.docs[0];
    const data = doc.data();
    const hashed = await hashPW(pw);
    if (data.password !== hashed) return alert2('login-alert','❌ 비밀번호가 틀렸습니다.');
    sessionStorage.setItem('gameUser', JSON.stringify({
      uid: doc.id, id, isAdmin:false,
      name: data.name, charName: data.charName
    }));
    window.location.href='main.html';
  } catch(e) { alert2('login-alert','오류: '+e.message); }
}

async function doSignup() {
  const id      = document.getElementById('su-id').value.trim();
  const name    = document.getElementById('su-name').value.trim();
  const stunum  = document.getElementById('su-stunum').value.trim();
  const email   = document.getElementById('su-email').value.trim();
  const pw      = document.getElementById('su-pw').value;
  const pw2     = document.getElementById('su-pw2').value;

  if (!id||!name||!stunum||!email||!pw||!pw2)
    return alert2('signup-alert','모든 항목을 입력하세요.');
  if (!/^[a-zA-Z0-9]{4,20}$/.test(id))
    return alert2('signup-alert','아이디는 영문/숫자 4~20자로 입력하세요.');
  if (pw.length < 6)
    return alert2('signup-alert','비밀번호는 6자 이상이어야 합니다.');
  if (pw !== pw2)
    return alert2('signup-alert','비밀번호가 일치하지 않습니다.');

  // 중복 확인
  const dup = await db.collection('users').where('id','==',id).get();
  if (!dup.empty) return alert2('signup-alert','❌ 이미 사용 중인 아이디입니다.');

  const emailDup = await db.collection('users').where('email','==',email).get();
  if (!emailDup.empty) return alert2('signup-alert','❌ 이미 사용 중인 이메일입니다.');

  const hashed = await hashPW(pw);
  await db.collection('users').add({
    id, name, stunum, email,
    password: hashed,
    score: 0, level: 1,
    quests: {}, charName: null,
    created_at: new Date().toISOString()
  });
  alert2('signup-alert','✅ 가입 완료! 로그인하세요.','success');
  setTimeout(() => showTab('login'), 1500);
}

async function doFind() {
  const email = document.getElementById('find-email').value.trim();
  if (!email) return alert2('find-alert','이메일을 입력하세요.');
  const snap = await db.collection('users').where('email','==',email).get();
  if (snap.empty) return alert2('find-alert','❌ 해당 이메일로 가입된 계정이 없습니다.');
  // 실제 이메일 발송은 서버 함수 필요 - 아이디만 표시
  const data = snap.docs[0].data();
  alert2('find-alert',`✅ 아이디: <strong>${data.id}</strong><br>비밀번호는 관리자에게 문의하세요.`,'success');
}

function tempLogin(type) {
  if (type==='admin') {
    sessionStorage.setItem('gameUser', JSON.stringify({uid:'admin',id:'admin',isAdmin:true,name:'관리자'}));
    window.location.href='admin.html';
  } else {
    sessionStorage.setItem('gameUser', JSON.stringify({uid:'student',id:'student',isAdmin:false,name:'임시학생',isTemp:true}));
    window.location.href='main.html';
  }
}

// SHA-256 해시
async function hashPW(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
</script>
</body>
</html>
