<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>퀘스트2 - 아버지를 찾아서</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;overflow:hidden;user-select:none;font-family:'Noto Sans KR',sans-serif;}
    .game-screen{position:fixed;inset:0;background:#000;}
    .game-bg{position:absolute;inset:0;background:url('images/bgq2-1.png') center/cover no-repeat;}
    .game-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 25%,rgba(0,0,0,0.82) 100%);}
    .ai-notice{position:absolute;top:52px;left:12px;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.6);z-index:25;backdrop-filter:blur(4px);}

    /* 캐릭터 */
    .my-char{position:absolute;bottom:clamp(155px,21vw,210px);left:3%;height:clamp(110px,33vh,320px);object-fit:contain;filter:drop-shadow(4px 4px 10px rgba(0,0,0,0.9)) brightness(0.85);animation:charFloat 3s ease-in-out infinite .5s;z-index:10;transition:all .4s;}
    .speaker-char{position:absolute;bottom:clamp(155px,21vw,210px);right:3%;height:clamp(110px,33vh,320px);object-fit:contain;filter:drop-shadow(-4px 4px 10px rgba(0,0,0,0.9));animation:charFloat 3s ease-in-out infinite;z-index:11;transition:all .5s;}
    .speaker-char2{position:absolute;bottom:clamp(155px,21vw,210px);right:clamp(110px,18vw,240px);height:clamp(90px,26vh,260px);object-fit:contain;filter:drop-shadow(-4px 4px 10px rgba(0,0,0,0.9)) brightness(0.85);animation:charFloat 3s ease-in-out infinite .8s;z-index:10;display:none;transition:all .5s;}
    @keyframes charFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

    /* HUD */
    .game-hud{position:absolute;top:0;left:0;right:0;padding:10px 14px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);z-index:20;}
    .hud-back{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.2);border-radius:7px;padding:5px 10px;color:white;font-size:12px;cursor:pointer;text-decoration:none;white-space:nowrap;flex-shrink:0;}
    .hud-title{font-family:'Jua',sans-serif;font-size:clamp(11px,2.2vw,14px);color:white;text-shadow:0 2px 4px rgba(0,0,0,0.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .hud-right{display:flex;gap:6px;margin-left:auto;flex-shrink:0;}
    .hud-score{background:rgba(99,179,237,0.25);border:1px solid rgba(99,179,237,0.4);border-radius:20px;padding:4px 10px;font-size:12px;color:#63b3ed;font-weight:700;white-space:nowrap;}
    .hud-progress{background:rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;font-size:11px;color:rgba(255,255,255,0.7);white-space:nowrap;}

    /* 대화창 */
    .dialog-box{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:0 clamp(8px,3vw,20px) clamp(10px,2vh,16px);}
    .dialog-top-bar{display:flex;align-items:center;gap:8px;margin-bottom:0;}
    .char-name-tag{display:inline-block;background:linear-gradient(135deg,#63b3ed,#4299e1);color:#0a0e1a;font-weight:700;font-family:'Jua',sans-serif;padding:5px 16px;border-radius:10px 10px 0 0;font-size:clamp(12px,3vw,15px);box-shadow:0 -2px 10px rgba(99,179,237,0.3);transition:background .4s;}
    .char-name-tag.turing{background:linear-gradient(135deg,#68d391,#38a169);}
    .char-name-tag.hinton{background:linear-gradient(135deg,#f6ad55,#ed8936);}
    .char-name-tag.both{background:linear-gradient(135deg,#b794f4,#805ad5);}
    .char-name-tag.goodfellow{background:linear-gradient(135deg,#fc8181,#e53e3e);}
    .btn-prev{margin-left:auto;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:4px 10px;color:rgba(255,255,255,0.7);font-size:12px;cursor:pointer;font-family:inherit;display:none;align-items:center;transition:all .2s;}
    .dialog-text-box{background:rgba(10,14,26,0.94);border:2px solid rgba(99,179,237,0.4);border-radius:0 12px 12px 12px;padding:clamp(14px,2.5vw,20px) clamp(40px,6vw,55px) clamp(14px,2.5vw,20px) clamp(14px,2.5vw,22px);position:relative;min-height:clamp(90px,13vh,125px);max-height:clamp(150px,26vh,220px);overflow-y:auto;backdrop-filter:blur(10px);box-shadow:0 -4px 30px rgba(0,0,0,0.5);}
    .dialog-text{font-size:clamp(14px,2.4vw,17px);line-height:1.85;color:#e2e8f0;text-shadow:0 1px 3px rgba(0,0,0,0.5);white-space:pre-line;}
    .dialog-next{position:absolute;bottom:12px;right:12px;width:26px;height:26px;background:rgba(99,179,237,0.2);border:2px solid rgba(99,179,237,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:arrowBounce 1s ease-in-out infinite;}
    .dialog-next::after{content:'▼';font-size:10px;color:#63b3ed;}
    @keyframes arrowBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(3px);}}

    /* 퀴즈 팝업 */
    .quiz-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);}
    .quiz-box{background:#111827;border:1px solid rgba(99,179,237,0.3);border-radius:20px;width:100%;max-width:600px;padding:clamp(18px,3vw,28px);animation:slideUp .4s ease;box-shadow:0 0 80px rgba(99,179,237,0.15);max-height:92vh;overflow-y:auto;}
    @keyframes slideUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
    .quiz-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .quiz-header h2{font-family:'Jua',sans-serif;font-size:clamp(16px,3vw,20px);color:#63b3ed;}
    .quiz-question{font-size:clamp(14px,2.5vw,16px);font-weight:600;margin:12px 0;line-height:1.6;color:#e2e8f0;}

    /* 드래그앤드롭 */
    .dnd-two-col{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;}
    .dnd-person{flex:1;min-width:140px;background:rgba(255,255,255,0.03);border-radius:12px;padding:12px;}
    .dnd-person h4{font-size:13px;font-weight:700;margin-bottom:10px;text-align:center;padding:7px;border-radius:8px;}
    .dnd-person.turing h4{background:rgba(104,211,145,0.2);color:#68d391;}
    .dnd-person.hinton h4{background:rgba(246,173,85,0.2);color:#f6ad55;}
    .source-pool{background:rgba(255,255,255,0.03);border-radius:12px;padding:12px;margin-bottom:12px;}
    .source-pool h4{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;}
    .pool-items{display:flex;flex-wrap:wrap;gap:7px;}
    .dnd-item{background:rgba(99,179,237,0.1);border:2px solid rgba(99,179,237,0.25);border-radius:9px;padding:8px 12px;cursor:grab;font-size:clamp(12px,2vw,13px);color:#e2e8f0;transition:all .2s;display:flex;align-items:center;gap:6px;}
    .dnd-item:hover{background:rgba(99,179,237,0.2);border-color:rgba(99,179,237,0.5);}
    .dnd-item.dragging{opacity:0.35;}
    .drag-handle{color:rgba(255,255,255,0.3);}
    .dnd-slot{background:rgba(255,255,255,0.04);border:2px dashed rgba(255,255,255,0.15);border-radius:9px;padding:8px 10px;margin-bottom:7px;min-height:40px;font-size:clamp(11px,2vw,12px);color:rgba(255,255,255,0.3);transition:all .2s;display:flex;align-items:center;}
    .dnd-slot.over{background:rgba(99,179,237,0.1);border-color:rgba(99,179,237,0.4);}
    .dnd-slot.filled{background:rgba(99,179,237,0.08);border:2px solid rgba(99,179,237,0.3);color:#e2e8f0;}
    .dnd-slot.correct{background:rgba(104,211,145,0.15);border:2px solid #68d391;color:#68d391;}
    .dnd-slot.wrong{background:rgba(252,129,129,0.15);border:2px solid #fc8181;color:#fc8181;}
    .quiz-check-btn{width:100%;padding:12px;margin-top:12px;background:linear-gradient(135deg,#63b3ed,#4299e1);border:none;border-radius:11px;color:#0a0e1a;font-size:clamp(13px,2.5vw,15px);font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;}
    .quiz-check-btn:hover{transform:translateY(-2px);}
    .quiz-feedback{margin-top:10px;padding:10px 14px;border-radius:9px;font-size:clamp(12px,2vw,13px);line-height:1.5;}
    .quiz-feedback.correct{background:rgba(104,211,145,0.15);border:1px solid #68d391;color:#68d391;}
    .quiz-feedback.wrong{background:rgba(252,129,129,0.15);border:1px solid #fc8181;color:#fc8181;}
    .quiz-result{text-align:center;padding:16px 0;}
    .quiz-result .big-emoji{font-size:clamp(48px,8vw,64px);margin-bottom:12px;}
    .quiz-result h3{font-size:clamp(18px,3.5vw,22px);margin-bottom:6px;}
    .quiz-result .xp-gain{color:#f6ad55;font-size:clamp(16px,3vw,20px);margin-bottom:16px;}

    .levelup-screen{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
    .levelup-screen h1{font-family:'Jua',sans-serif;font-size:clamp(32px,6vw,48px);color:#f6ad55;}
    .levelup-screen p{font-size:clamp(16px,3vw,20px);color:#63b3ed;}
    .xp-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,#63b3ed,#f6ad55);color:#0a0e1a;font-weight:700;font-size:clamp(18px,4vw,24px);padding:14px 36px;border-radius:18px;z-index:500;animation:popIn .4s ease,fadeOutUp .5s ease 1.5s forwards;pointer-events:none;}
    @keyframes popIn{from{transform:translate(-50%,-50%) scale(.5);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
    @keyframes fadeOutUp{to{opacity:0;transform:translate(-50%,-70%);}}
    @media(max-width:480px){
      .my-char,.speaker-char{height:clamp(90px,25vh,180px);}
      .speaker-char2{height:clamp(70px,18vh,140px);}
      .dnd-two-col{flex-direction:column;}
    }

    /* 퀴즈 확인 팝업 */
    .quiz-confirm-overlay{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:clamp(12px,3vw,20px);}
    .quiz-confirm-box{background:#111827;border:2px solid rgba(104,211,145,0.4);border-radius:24px;padding:clamp(24px,4vw,36px) clamp(20px,4vw,32px);text-align:center;max-width:360px;width:90%;box-shadow:0 0 60px rgba(104,211,145,0.2);animation:slideUp .4s ease;}
    .quiz-confirm-emoji{font-size:clamp(44px,8vw,64px);margin-bottom:14px;}
    .quiz-confirm-title{font-family:'Jua',sans-serif;font-size:clamp(18px,4vw,24px);color:#68d391;margin-bottom:8px;}
    .quiz-confirm-desc{font-size:clamp(13px,2.5vw,15px);color:rgba(255,255,255,0.6);margin-bottom:24px;line-height:1.6;}
    .quiz-confirm-btns{display:flex;gap:10px;}
    .quiz-confirm-ok{flex:1;padding:clamp(12px,2.5vw,14px);background:linear-gradient(135deg,#68d391,#38a169);border:none;border-radius:12px;color:#0b101d;font-size:clamp(14px,3vw,16px);font-weight:700;cursor:pointer;font-family:inherit;transition:all .3s;}
    .quiz-confirm-ok:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(104,211,145,0.4);}
    .quiz-confirm-cancel{padding:clamp(12px,2.5vw,14px) clamp(16px,3vw,20px);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:12px;color:rgba(255,255,255,0.6);font-size:clamp(13px,2.5vw,15px);cursor:pointer;font-family:inherit;}
  </style>
</head>
<body>

<!-- 퀴즈 팝업 -->
<div id="quiz-overlay" class="quiz-overlay" style="display:none;">
  <div class="quiz-box">
    <div class="quiz-header">
      <h2 id="quiz-title">🔍 인공지능 아버지 퀴즈!</h2>
      <span id="quiz-step" style="font-size:12px;color:rgba(255,255,255,0.4);margin-left:auto;"></span>
    </div>
    <div id="quiz-content"></div>
  </div>
</div>

<div class="game-screen">
  <div class="game-bg" id="game-bg"></div>
  <div class="ai-notice">본 프로그램의 배경화면과 캐릭터는 AI로 생성되었습니다.</div>

  <!-- 내 캐릭터 (왼쪽) -->
  <img class="my-char" id="my-char" src="images/robot_1.png" alt="내캐릭터">
  <!-- 두 번째 화자 (오른쪽 뒤) -->
  <img class="speaker-char2" id="speaker-char2" src="images/char2-1.png" alt="앨런튜링">
  <!-- 주 화자 (오른쪽 앞) -->
  <img class="speaker-char" id="speaker-char" src="images/char2-1.png" alt="캐릭터">

  <div class="game-hud">
    <a href="main.html" class="hud-back">← 메인</a>
    <div class="hud-title">🔍 퀘스트 2: 아버지를 찾아서</div>
    <div class="hud-right">
      <div class="hud-progress" id="hud-progress">1 / 9</div>
      <div class="hud-score" id="hud-score">0 점</div>
    </div>
  </div>

  <div class="dialog-box">
    <div class="dialog-top-bar">
      <div class="char-name-tag" id="dialog-name">내레이터</div>
      <button class="btn-prev" id="btn-prev" onclick="prevMessage()">◀ 이전</button>
    </div>
    <div class="dialog-text-box hud-style">
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-next" id="dialog-next" onclick="nextMessage()"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// speaker: 0=내레이터, 1=앨런튜링(char2-1), 2=제프리힌턴(char2-2), 3=둘다, 4=이언굿펠로(char2-3)
// bg: 기본=bgq2-1, 지정 시 msg.bg로 배경 변경
const MESSAGES = [
  { speaker:0, name:"내레이터", cls:"",
    text:"나의 아버지를 소개할께.\n음악의 아버지가 바흐라면\n인공지능의 아버지는 앨런 튜링(Alan Turing)과\n제프리 힌턴(Geoffrey Hinton)이야." },
  { speaker:1, name:"앨런 튜링", cls:"turing",
    text:"나를 소개하지.\n나는 영국의 수학자야.\n나는 1912년에 태어났지.\n그래서 나 때에는 우리가 아는 컴퓨터가 없었지.\n그냥 내 생각으로만 무엇이든 계산할 수 있는\n상상속의 기계를 설계했지.\n이게 바로 튜링 기계야." },
  { speaker:1, name:"앨런 튜링", cls:"turing",
    text:"기계가 생각하는지 어떻게 알까?\n그래서 난 기계가 생각할 수 있는지 알 수 있는\n시험방법을 생각해냈지.\n먼저 벽 뒤에 있는 사람과 기계에게 채팅으로 질문을 하는거야.\n만약 {{name}}이 그 둘하고 대화해서\n누가 사람이고 기계인지 구분할 수 없다면\n그 기계는 지능을 가졌다고 볼 수 있는거야." },
  { speaker:1, name:"앨런 튜링", cls:"turing",
    text:"이걸 튜링 테스트라고 해. 🧪\n오늘날 ChatGPT 같은 AI들이 바로 이 테스트를\n통과할 수 있는 수준이야!" },
  { speaker:2, name:"제프리 힌턴", cls:"hinton",
    text:"나를 소개하지.\n나는 영국에서 태어나 캐나다 국적도 가지고 있지.\n나는 1947년에 태어난 컴퓨터 과학자 겸 심리학자야.\n앞에 나온 앨런 튜링 이후 인공지능은 긴 침체기였어.\n그 동안에는 기계에게 인간이 모든 규칙을 가르쳐야 했지." },
  { speaker:2, name:"제프리 힌턴", cls:"hinton",
    text:"그래서 나는 인공신경망 방식을 주장했지.\n인간의 뇌가 수많은 뉴런으로 연결되서 학습하는 것처럼\n뉴런처럼 생긴 수학적 노드를 엄청 많이 쌓아 올리는 방법이지. 🧠" },
  { speaker:2, name:"제프리 힌턴", cls:"hinton",
    text:"나는 결국 이 방법으로 효율적으로 학습시키는 방법을 찾았고\n이걸 딥러닝이라고 불렀어.\n덕분에 2024년 노벨 물리학상을 수상했지! 🏆" },
  { speaker:3, name:"앨런 튜링 & 제프리 힌턴", cls:"both",
    text:"앨런 튜링이 AI라는 꿈을 꾸었다면,\n제프리 힌턴은 그 꿈을 현실로 만드는 딥러닝을 만들었지.\n둘 다 인공지능의 역사에서 빠질 수 없는 아버지들이야! 👨‍👨‍👦" },
  { speaker:3, name:"앨런 튜링 & 제프리 힌턴", cls:"both",
    text:"자, 우리 두 사람에 대해 잘 배웠지?\n두 사람의 특징을 구분하는 퀴즈를 풀어볼까? 🎮",
    type:"quiz_1" },

  // ── 2부: 지도학습/비지도학습 (배경 bgq2-2) ──
  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-2",
    text:"인공지능의 시작을 알아봤으니\n인공지능 학습의 가장 큰 두 줄기를 알아보도록 하자." },
  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-2",
    text:"인공지능 학습방법에는 크게\n[지도학습]과 [비지도학습]이 있지." },
  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-2",
    text:"지도학습이란 인공지능에게 문제와 정답을\n세트로 다 알려주면서 가르치는 방법이야." },
  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-2",
    text:"마치 인간이 기출문제와 답을 보면서\n\"아! 이 문제는 이렇게 푸는구나!\"라고\n깨닫게 하는 방법이야." },

  // 배경 bgq2-3
  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-3",

  { speaker:2, name:"제프리 힌턴", cls:"hinton", bg:"bgq2-3",

let currentUser=null, userData=null;

let quizShowing=false;

requireAuth(async (user) => {
  currentUser=user;
  if(user.uid==='student'){
    const local=JSON.parse(localStorage.getItem('tempUserData')||'null');
    userData=local||{charName:'AI',score:0,quests:{},name:'임시학생'};
  } else {
    const snap=await db.collection('users').where('id','==',user.id).get();
    if(!snap.empty){userData=snap.docs[0].data();currentUser.uid=snap.docs[0].id;}
  }
  // 이름 치환
  MESSAGES[2].text=MESSAGES[2].text.replace('{{name}}', userData.name||'당신');
  updateHUD(); updateCharImages();

  // 완료된 퀘스트는 처음부터 다시 시작
  const quests=userData.quests||{};
  if(quests.q2_done){
    msgIdx=0;
  } else {
    msgIdx=Math.min(quests.q2_msgIdx||0, MESSAGES.length-1);
  }

});

function updateCharImages(){
  const lv=getLevelByScore(userData.score||0, userData.charTrack);
  document.getElementById('my-char').src=lv.img;
}
function updateHUD(){
  document.getElementById('hud-score').textContent=(userData.score||0)+' 점';
  document.getElementById('hud-progress').textContent=`${msgIdx+1} / ${MESSAGES.length}`;
}

function showMessage(idx){
  if(idx>=MESSAGES.length){showComplete();return;}
  const msg=MESSAGES[idx];
  document.getElementById('hud-progress').textContent=`${idx+1} / ${MESSAGES.length}`;
  document.getElementById('btn-prev').style.display=idx>0?'flex':'none';

  // 배경 변경
  if(msg.bg){
    document.getElementById('game-bg').style.backgroundImage=`url('images/${msg.bg}.png')`;
  }

  // 화자별 처리
  const nameTag=document.getElementById('dialog-name');
  const sc=document.getElementById('speaker-char');
  const sc2=document.getElementById('speaker-char2');
  nameTag.className='char-name-tag '+(msg.cls||'');
  nameTag.textContent=msg.name;

  if(msg.speaker===0){
    sc.src='images/char2-1.png'; sc.style.display='block';
    sc2.style.display='none';
  } else if(msg.speaker===1){
    sc.src='images/char2-1.png'; sc.style.display='block';
    sc2.style.display='none';
  } else if(msg.speaker===2){
    sc.src='images/char2-2.png'; sc.style.display='block';
    sc2.style.display='none';
  } else if(msg.speaker===3){
    sc.src='images/char2-2.png'; sc.style.display='block';
    sc2.src='images/char2-1.png'; sc2.style.display='block';
  } else if(msg.speaker===4){
    sc.src='images/char2-3.png'; sc.style.display='block';
    sc2.style.display='none';
  }

  document.getElementById('dialog-next').style.display='flex';
  typeText(document.getElementById('dialog-text'), msg.text, ()=>{
    if(msg.type==='quiz_1'){
      document.getElementById('dialog-next').style.display='none';
      quizShowing=true;
      setTimeout(()=>showQuizConfirm(()=>showQuiz1()), 600);
    } else if(msg.type==='quiz_2'){
      document.getElementById('dialog-next').style.display='none';
      quizShowing=true;
      setTimeout(()=>showQuizConfirm(()=>showQuiz2()), 600);
    }
  });
}

function typeText(el,text,cb){
  el.textContent=''; isTyping=true;
  document.getElementById('dialog-next').style.opacity='0.3';
  let i=0;
  typingTimer=setInterval(()=>{
    if(i<text.length){el.textContent=text.slice(0,i+1);i++;}
    else{
      clearInterval(typingTimer); el.textContent=text; isTyping=false;
      document.getElementById('dialog-next').style.opacity='1';
      if(cb) cb();
    }
  },22);
}

function nextMessage(){
  if(quizShowing) return;
  if(isTyping){
    clearInterval(typingTimer);
    const msg=MESSAGES[msgIdx];
    document.getElementById('dialog-text').textContent=msg.text;
    isTyping=false;
    document.getElementById('dialog-next').style.opacity='1';
    if(msg.type==='quiz_1'){
      document.getElementById('dialog-next').style.display='none';
      quizShowing=true; setTimeout(()=>showQuizConfirm(()=>showQuiz1()),400);
    } else if(msg.type==='quiz_2'){
      document.getElementById('dialog-next').style.display='none';
      quizShowing=true; setTimeout(()=>showQuizConfirm(()=>showQuiz2()),400);
    }
    return;
  }
  msgIdx++; autoSave(); showMessage(msgIdx);
}

function prevMessage(){
  if(quizShowing) return;
  if(isTyping){clearInterval(typingTimer);isTyping=false;}
  if(msgIdx>0){msgIdx--;showMessage(msgIdx);}
}

async function autoSave(){
  if(currentUser.uid==='student'){
    userData.quests=userData.quests||{};
    userData.quests.q2_msgIdx=msgIdx;
    localStorage.setItem('tempUserData',JSON.stringify(userData));
    return;
  }
  await db.collection('users').doc(currentUser.uid).update({'quests.q2_msgIdx':msgIdx});
}

document.addEventListener('click',(e)=>{
  if(quizShowing) return;
  if(document.getElementById('board-overlay')) return;
  if(document.getElementById('complete-btns')) return;
  if(e.target.closest('.quiz-overlay')||e.target.closest('.dialog-next')||
     e.target.closest('.hud-back')||e.target.closest('.btn-prev')) return;
  nextMessage();
});
document.addEventListener('keydown',(e)=>{
  if(quizShowing) return;
  if(document.getElementById('board-overlay')) return;
  if(document.getElementById('complete-btns')) return;
  if(e.code==='Space'||e.code==='Enter') nextMessage();
  if(e.code==='ArrowLeft') prevMessage();
});

        <h4>🇬🇧 앨런 튜링</h4>
        ${['t1','t2','t3'].map(sid=>`
          <div class="dnd-slot" id="slot-${sid}" data-person="turing" data-sid="${sid}"
            ondragover="dragOver(event)" ondragleave="dragLeave(event)"
            ondrop="dropItem(event,'${sid}','turing')">
            여기에 드래그
          </div>`).join('')}
      </div>
      <div class="dnd-person hinton">
        <h4>🍁 제프리 힌턴</h4>
        ${['h1','h2','h3'].map(sid=>`
          <div class="dnd-slot" id="slot-${sid}" data-person="hinton" data-sid="${sid}"

            여기에 드래그
          </div>`).join('')}
      </div>

    <div id="quiz-feedback"></div>
    <button class="quiz-check-btn" id="check-btn" onclick="checkQuiz()">✅ 정답 확인</button>`;
}

function dropItem(e,sid,person){
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const itemId=e.dataTransfer.getData('text')||currentDragId;
  const item=QUIZ_ITEMS.find(i=>i.id===itemId); if(!item) return;
  // 기존 슬롯에서 제거
  Object.keys(slotMap).forEach(k=>{
    if(slotMap[k]===itemId){
      const old=document.getElementById('slot-'+k);
      if(old){old.textContent='여기에 드래그';old.classList.remove('filled');}
      delete slotMap[k];
    }
  });
  slotMap[sid]=itemId;
  const slot=document.getElementById('slot-'+sid);
  slot.textContent=item.text; slot.classList.add('filled');
}

function checkQuiz(){
  let correct=0;
  QUIZ_ITEMS.forEach(item=>{
    const sid=Object.keys(slotMap).find(k=>slotMap[k]===item.id);
    if(!sid) return;
    const slot=document.getElementById('slot-'+sid);
    const assignedPerson=document.getElementById('slot-'+sid)?.dataset?.person;
    if(assignedPerson===item.answer){slot.classList.add('correct');correct++;}
    else slot.classList.add('wrong');
  });
  const total=QUIZ_ITEMS.length;
  const ok=correct===total;
  document.getElementById('quiz-feedback').innerHTML=`
    <div class="quiz-feedback ${ok?'correct':'wrong'}" style="margin-top:10px;">
      ${ok?'🎉 완벽해요!':'❌ 아쉬워요!'} ${correct}/${total}개 정답!<br>
      튜링: 1912년생·튜링기계·튜링테스트 / 힌턴: 인공신경망·딥러닝·노벨상
    </div>
    <button class="quiz-check-btn" onclick="finishQuiz1(${correct},${total})">
      결과 보기 →
    </button>`;
  document.getElementById('check-btn').style.display='none';
}

async function finishQuiz1(correct, total){
  const xp=correct*8+(correct===total?20:0);
  await saveQuizResult('q2_quiz1',correct,total,xp);
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-result">
      <div class="big-emoji">${correct===total?'🏆':correct>=4?'👍':'💪'}</div>
      <h3>${correct} / ${total} 정답</h3>
      <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;">정답률 ${Math.round(correct/total*100)}%</div>
      <div class="xp-gain">+${xp} 점 획득!</div>
      <button class="quiz-check-btn" onclick="closeQuiz1()">계속하기 →</button>
    </div>`;
  showXPPopup('+'+xp+' 점');
}

function closeQuiz1(){
  quizShowing=false;
  document.getElementById('quiz-overlay').style.display='none';
  msgIdx++; autoSave(); showMessage(msgIdx);
}

  const total=QUIZZES_2.length;
  const xp=q2Score*12+(q2Score===total?20:0);
  await saveQuizResult('q2_quiz2',q2Score,total,xp);
  document.getElementById('quiz-content').innerHTML=`
    <div class="quiz-result">
      <div class="big-emoji">${q2Score===total?'🏆':q2Score>=2?'👍':'💪'}</div>
      <h3>${q2Score} / ${total} 정답</h3>
      <div style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:8px;">정답률 ${Math.round(q2Score/total*100)}%</div>
      <div class="xp-gain">+${xp} 점 획득!</div>
      <button class="quiz-check-btn" onclick="closeQuiz2()">계속하기 →</button>
    </div>`;
  showXPPopup('+'+xp+' 점');
}

function closeQuiz2(){
  quizShowing=false;
  document.getElementById('quiz-overlay').style.display='none';
  showBoard();
}

async function saveQuizResult(quizName, score, total, xp){
  if(currentUser.uid==='student'){
    userData.score=(userData.score||0)+xp;
    localStorage.setItem('tempUserData',JSON.stringify(userData));
    updateHUD(); updateCharImages();
  } else {
    await addScore(currentUser.uid,xp,'퀘스트2 퀴즈');
    await db.collection('quiz_results').doc(currentUser.uid).set({
      [quizName]:firebase.firestore.FieldValue.arrayUnion({
        score,total,xp,accuracy:Math.round(score/total*100),
        date:new Date().toISOString()
      })
    },{merge:true});
    userData.score=(userData.score||0)+xp;
    updateHUD(); updateCharImages();
    checkLevelUp(userData.score-xp,userData.score);
  }
}

async function submitPost(){
  const content=document.getElementById('board-content').value.trim();
  const link=document.getElementById('board-link').value.trim();
  const alertEl=document.getElementById('board-alert');
  alertEl.innerHTML=`<div style="color:#63b3ed;font-size:12px;">게시 중...</div>`;
  const result=await submitBoardPost('board_q2',userData,currentUser,content,link);
  if(!result.ok){alertEl.innerHTML=`<div style="color:#fc8181;font-size:12px;">⚠️ ${result.msg}</div>`;return;}
  document.getElementById('board-content').value='';
  document.getElementById('board-link').value='';
  alertEl.innerHTML=`<div style="color:#68d391;font-size:12px;">✅ 게시완료! +${BOARD_DEFAULT_XP}점</div>`;
  setTimeout(()=>alertEl.innerHTML='',2500);
  showXPPopup('+'+BOARD_DEFAULT_XP+' 점');
  loadPosts();
}

async function loadPosts(){
  const container=document.getElementById('board-posts');

  try{
    const myId=currentUser.uid==='student'?('temp_'+(userData.charName||'익명')):currentUser.uid;

    container.innerHTML=posts.map(d=>{
      const isMe=d.authorId===myId;
      const isAdmin=currentUser.uid==='admin';
      const canDelete=isMe||isAdmin;
      const date=d.created_at?.slice(0,16).replace('T',' ')||'';
      const xp=d.xp||BOARD_DEFAULT_XP;
      return `<div id="post-${d.id}" style="background:rgba(255,255,255,0.04);border:1px solid ${isMe?'rgba(99,179,237,0.3)':'rgba(255,255,255,0.08)'};border-radius:12px;padding:14px;margin-bottom:10px;">

          <span style="font-size:13px;font-weight:700;color:${isMe?'#63b3ed':'#e2e8f0'};">${isMe?'👤 ':''}${d.authorName}${d.isTemp?'<span style="font-size:10px;color:rgba(255,255,255,0.3);"> (임시)</span>':''}</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="background:rgba(246,173,85,0.15);border:1px solid rgba(246,173,85,0.3);border-radius:6px;padding:2px 8px;font-size:11px;color:#f6ad55;">+${xp}점</span>
            <span style="font-size:11px;color:rgba(255,255,255,0.3);">${date}</span>
            ${canDelete?`<button onclick="deleteMyPost('${d.id}')" style="background:rgba(252,129,129,0.15);border:1px solid rgba(252,129,129,0.3);border-radius:6px;padding:3px 8px;color:#fc8181;font-size:11px;cursor:pointer;font-family:inherit;">🗑️</button>`:''}
          </div>
        </div>
        <p style="font-size:14px;color:#e2e8f0;line-height:1.6;margin-bottom:${d.link?'8px':'0'};white-space:pre-wrap;">${d.content}</p>

}

async function deleteMyPost(docId){
  if(!confirm('이 게시글을 삭제할까요?')) return;
  try{
    const snap=await db.collection('board_q2').doc(docId).get();
    if(snap.exists){
      const post=snap.data();
      const xp=post.xp||BOARD_DEFAULT_XP;
      
      const myId=currentUser.uid==='student'?('temp_'+(userData.charName||'익명')):currentUser.uid;
      const isAdmin=currentUser.uid==='admin';
      if(post.authorId!==myId && !isAdmin){
        alert('삭제 권한이 없습니다.');
        return;
      }
      
      await db.collection('board_q2').doc(docId).delete();
      if(post.isTemp){
        if(post.authorId===myId){
          userData.score=Math.max(0,(userData.score||0)-xp);
          localStorage.setItem('tempUserData',JSON.stringify(userData));
        }
      } else {
        await addScore(post.authorId,-xp,'게시글 삭제 (board_q2)');
      }
    }
    document.getElementById('post-'+docId)?.remove();
  }catch(e){alert('삭제 실패: '+e.message);}
}

async function skipBoard(){
  const el=document.getElementById('board-overlay');
  if(el) el.remove();
  if(currentUser.uid==='student'){
    userData.quests=userData.quests||{};
    userData.quests.q2_done=true;
    localStorage.setItem('tempUserData',JSON.stringify(userData));
  } else {
    await db.collection('users').doc(currentUser.uid).update({'quests.q2_done':true, 'quests.q2_msgIdx':MESSAGES.length});

}

        <button class="quiz-check-btn" style="max-width:180px;margin-top:8px;position:relative;z-index:1;" onclick="this.parentElement.parentElement.remove()">확인</button>

// 드래그
function dragStart(e,id){currentDragId=id;e.dataTransfer.setData('text',id);setTimeout(()=>document.getElementById('item-'+id)?.classList.add('dragging'),0);}
function dragEnd(){document.querySelectorAll('.dnd-item').forEach(el=>el.classList.remove('dragging'));}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('over');}
function dragLeave(e){e.currentTarget.classList.remove('over');}

// 터치
function touchStart(e,id){
  touchDragId=id;
  const el=document.getElementById('item-'+id);
  touchClone=el.cloneNode(true);
  touchClone.style.cssText=`position:fixed;opacity:0.85;pointer-events:none;z-index:999;background:#1a2235;border-radius:9px;padding:8px 12px;font-size:13px;color:#e2e8f0;border:2px solid rgba(99,179,237,0.4);`;
  document.body.appendChild(touchClone);
}
function touchMove(e){
  e.preventDefault();
  const t=e.touches[0];
  if(touchClone){touchClone.style.left=(t.clientX-60)+'px';touchClone.style.top=(t.clientY-20)+'px';}
  document.querySelectorAll('.dnd-slot').forEach(s=>s.classList.remove('over'));
  document.elementFromPoint(t.clientX,t.clientY)?.closest('.dnd-slot')?.classList.add('over');
}
function touchEnd(e){
  if(touchClone){touchClone.remove();touchClone=null;}
  document.querySelectorAll('.dnd-slot').forEach(s=>s.classList.remove('over'));
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY)?.closest('.dnd-slot');
  if(!el||!touchDragId) return;
  const sid=el.dataset.sid;
  const person=el.dataset.person;
  const item=QUIZ_ITEMS.find(i=>i.id===touchDragId);
  if(item&&sid){
    Object.keys(slotMap).forEach(k=>{
      if(slotMap[k]===touchDragId){
        const old=document.getElementById('slot-'+k);
        if(old){old.textContent='여기에 드래그';old.classList.remove('filled');}
        delete slotMap[k];
      }
    });
    slotMap[sid]=touchDragId;
    el.textContent=item.text; el.classList.add('filled');
  }
  touchDragId=null;
}

// 퀴즈 시작 확인 팝업

}
